<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>員工打卡系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#2b2724; --muted:#857d74; --line:#e7e1d8;
  --accent:#b5674a; --accent-ink:#fff; --soft:#f3e7e1;
  --ok:#3f7d5a; --ok-soft:#e3f0e8; --warn:#b07a1f; --warn-soft:#f7ecd6; --bad:#b4483e; --bad-soft:#f6e1de;
  --shadow:0 1px 2px rgba(40,30,20,.05),0 6px 20px rgba(40,30,20,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1917; --card:#252220; --ink:#efe9e3; --muted:#a39a90; --line:#3a3532;
    --accent:#d58a6c; --accent-ink:#1b1917; --soft:#3a2b25;
    --ok:#7cc29a; --ok-soft:#22362b; --warn:#e0b25e; --warn-soft:#3a3020; --bad:#e58a80; --bad-soft:#3d2523;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1917; --card:#252220; --ink:#efe9e3; --muted:#a39a90; --line:#3a3532;
  --accent:#d58a6c; --accent-ink:#1b1917; --soft:#3a2b25;
  --ok:#7cc29a; --ok-soft:#22362b; --warn:#e0b25e; --warn-soft:#3a3020; --bad:#e58a80; --bad-soft:#3d2523;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
.narrow{max-width:420px}
.banner{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:8px 16px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin:16px 0}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:var(--shadow)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.block{width:100%;margin-top:18px;padding:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.msg{margin-top:12px;font-size:14px;padding:8px 12px;border-radius:8px}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.clock{text-align:center;padding:28px 20px}
.clock .time{font-size:56px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.1}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:500}
.pill.off{background:var(--line);color:var(--muted)}
.pill.work{background:var(--ok-soft);color:var(--ok)}
.pill.break{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.punch{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.punch button{padding:16px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500}
.punch button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.punch button:disabled{opacity:.35;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.list li:last-child{border-bottom:0}
.tablewrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg)}
tfoot td{font-weight:700;border-bottom:0}
.right{text-align:right}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{width:auto}
.raw{background:var(--bg)}
.raw td{padding:6px 8px 10px 24px;white-space:normal}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin:3px 6px 3px 0;font-size:13px}
.chip button{border:0;background:none;color:var(--bad);cursor:pointer;padding:0 2px}
.addrow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-top:8px}
.empty{text-align:center;padding:30px;color:var(--muted)}
.mid{max-width:680px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cardhead h2{margin:0}
.cardhead input{width:auto}
/* ---------- 排班 ---------- */
.tabs{display:inline-flex;max-width:100%;margin:0 0 16px}
.tabs button{flex:none;padding:8px 18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px}
.cal .day{min-height:96px;border:1px solid var(--line);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;background:var(--card);text-align:left}
.cal .day:hover{border-color:var(--accent)}
.cal .day.other{opacity:.4}
.cal .day.today{border-color:var(--ink);border-width:1.5px}
.cal .dnum{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.cal .dnum span{font-weight:400;color:var(--muted);font-size:11px}
.sc{--pc:#857d74;font-size:11px;line-height:1.35;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;
  border-left:3px solid var(--pc);
  background:color-mix(in srgb,var(--pc) 18%,var(--card));color:color-mix(in srgb,var(--pc) 58%,var(--ink))}
.sc.flag{box-shadow:inset 0 0 0 1.5px var(--bad)}
.sc.flag::before{content:"!";font-weight:700;color:var(--bad);margin-right:3px}
.sc .t{opacity:.75}
.sc.off{background:transparent;color:var(--muted);border:1px dashed var(--muted);padding:1px 4px}
/* 居家上班：班前面加小房子圖示 */
.ico-home{width:11px;height:11px;vertical-align:-1px;margin-right:2px}
.pill.home{background:var(--soft);color:var(--accent)}
.pill.home .ico-home{width:12px;height:12px;margin-right:3px}
/* 24 小時制時間選擇（時、分兩個下拉） */
.tp{display:flex;align-items:center;gap:4px}
.tp select{width:auto;flex:1;min-width:0;padding:10px 8px;font-variant-numeric:tabular-nums}
.tp span{color:var(--muted);font-weight:700}
/* 月曆上方：每個人的班表開關 */
/* 月曆上方：全部／上班／休假 一鍵切換 */
.vseg{display:inline-flex;margin:0 0 10px;max-width:100%}
.vseg button{flex:none;padding:6px 16px}
.sc.alloff{text-align:center;font-weight:700;color:var(--accent);border-color:var(--accent);white-space:normal;line-height:1.25;text-overflow:clip}
.pfilter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.pfilter button{--pc:#857d74;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.pfilter button .sw{width:10px;height:10px;border-radius:50%;border:2px solid var(--pc);flex:none}
.pfilter button.on{color:var(--ink);border-color:color-mix(in srgb,var(--pc) 45%,var(--line));background:color-mix(in srgb,var(--pc) 12%,var(--card))}
.pfilter button.on .sw{background:var(--pc)}
.pfilter button.off-name span{text-decoration:line-through}
.pfilter button.ctl{color:var(--accent);border-style:dashed}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:14px 0 0;cursor:pointer;width:fit-content}
.check input{width:18px;height:18px;margin:0;padding:0;accent-color:var(--accent);cursor:pointer}
/* 拖曳班次 */
.cal [data-sid]{cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cal .day.drop-over{border:2px dashed var(--accent);padding:4px;background:var(--soft)}
.sc.dragging{opacity:.35}
.sc.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none}
.picks button:disabled{opacity:.4;cursor:not-allowed}
.more{font-size:11px;color:var(--muted)}
.dotname{--pc:#857d74;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;flex:none;font-weight:700;font-size:13px;
  box-shadow:inset 0 0 0 2px var(--pc);
  background:color-mix(in srgb,var(--pc) 18%,var(--card));color:color-mix(in srgb,var(--pc) 58%,var(--ink))}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px}
.colors .rowl{padding:6px 0}
.colorpick{width:44px;height:34px;padding:2px;border-radius:8px;cursor:pointer;flex:none}
/* 前台月班表：格子小，只顯示名字，點一天看詳細 */
.cal.compact .day{min-height:76px}
.cal.compact .sc .t{display:none}
.cal .day.sel{border-color:var(--accent);border-width:2px;padding:4px}
.sc.me{font-weight:700;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pc) 70%,var(--ink))}
.who{flex:1;min-width:0}
.who .small{display:block}
.rowl{display:flex;align-items:center;gap:10px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer}
.picks button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.warns{margin:12px 0 0;padding-left:18px;font-size:13px;color:var(--bad);line-height:1.7}
.calc{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}
.calc .w{color:var(--bad);font-weight:500}
.modal-bg{position:fixed;inset:0;background:rgba(30,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px;max-height:90vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.modal hr{border:0;border-top:1px solid var(--line);margin:16px 0 4px}
.modal h3{font-size:15px;margin:12px 0 0}
.btnrow{display:flex;gap:8px;margin-top:16px}
.btnrow .btn{flex:1;padding:11px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
@media (min-width:561px){ .modal-bg{align-items:center} .modal{border-radius:16px} }
@media (max-width:640px){
  .cal .day{min-height:70px;padding:4px 3px}
  .cal .dnum span,.sc .t{display:none}
  .sc{font-size:10.5px;padding:1px 4px;text-overflow:clip}
  .sc.flag::before{display:none}
}
@media (max-width:560px){
  .clock .time{font-size:44px}
  .punch{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:1fr 1fr}
  .addrow{grid-template-columns:1fr}
}
</style>
</head>

<div id="app"><div class="wrap narrow"><p class="muted">載入中…</p></div></div>

<script type="module">
/* ============================================================
   設定區
   1. 把 Firebase 專案設定貼到 FIREBASE_CONFIG（見 README）
   2. 留 null 會進入「示範模式」，資料只存在目前這台瀏覽器
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBvDLzuDmCdKrFafrTzY1pdz3I63ebEo-M",
  authDomain: "timeflies-clockin.firebaseapp.com",
  projectId: "timeflies-clockin",
  storageBucket: "timeflies-clockin.firebasestorage.app",
  messagingSenderId: "433828133334",
  appId: "1:433828133334:web:dbbda9762f9ae231294c77"
};
/* 範例：
const FIREBASE_CONFIG = {
  apiKey: "AIza...",
  authDomain: "your-project.firebaseapp.com",
  projectId: "your-project",
  appId: "1:123:web:abc"
};
*/
const STUDIO_NAME  = "如梭映像";
const EMAIL_DOMAIN = "clockin.timeflies.local";  // 帳號會轉成 帳號@這個網域 給 Firebase 用，員工不需要真的 email
const MAX_ADMINS   = 2;
const STALE_HOURS  = 18;  // 上班超過這麼久沒打下班，就視為忘記打卡
const FIX_DAYS     = 45;  // 員工最多可以補打幾天前的卡（要和 firestore.rules 一致）
const SCHED_DEFAULTS = { start: "09:30", end: "18:30", breakMin: 60, cycleStart: "" };  // 排班預設值（後台可改）
const LEAVE_TYPES = ["休假", "例假", "休息日", "特休", "病假", "事假", "其他"];      // 休假的假別選項

/* ---------- 小工具 ---------- */
const TYPES = { in: "上班", break_start: "開始休息", break_end: "結束休息", out: "下班" };
const WEEK = "日一二三四五六";
const pad = n => String(n).padStart(2, "0");
const fmtTime = d => d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : "—";
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtMonth = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const fmtDur = ms => { const m = Math.max(0, Math.round(ms / 60000)); return `${Math.floor(m / 60)}:${pad(m % 60)}`; };
const fmtDurLong = ms => { const m = Math.max(0, Math.round(ms / 60000)); return `${Math.floor(m / 60)} 小時 ${pad(m % 60)} 分`; };
const toHours = ms => (ms / 3600000).toFixed(2);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayLabel = dateStr => { const d = new Date(dateStr + "T00:00:00"); return `${dateStr.slice(5)}（${WEEK[d.getDay()]}）`; };
async function sha256(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const strip = u => ({ uid: u.uid, username: u.username, displayName: u.displayName, role: u.role });

/* ---------- 排班小工具 ---------- */
const parseDate = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const toMin = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const isOvernight = s => toMin(s.end) <= toMin(s.start);
// 排班工時 = 下班 − 上班 − 休息；下班早於上班視為跨夜班
const shiftHours = s => { let span = toMin(s.end) - toMin(s.start); if (span <= 0) span += 1440; return Math.max(0, span - (Number(s.breakMin) || 0)) / 60; };
const fmtH = h => String(Math.round(h * 100) / 100);
const shiftLabel = s => `${s.start}–${s.end}${isOvernight(s) ? "（跨夜）" : ""}`;
const PCOLORS = ["#4f8a66", "#b5674a", "#a07a22", "#3f78a0", "#8a5a9a", "#5e7d7a", "#9a5a6a"];
const isHex = c => typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c);
const defaultColor = uid => { let h = 0; for (const c of String(uid)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PCOLORS[h % PCOLORS.length]; };
// 管理員在「人員顏色」設定過的顏色優先，沒設定就用自動配色
const pcolor = uid => isHex(S.colors[uid]) ? S.colors[uid] : defaultColor(uid);
const byStart = (a, b) => a.date.localeCompare(b.date) || toMin(a.start) - toMin(b.start);
// schedules 集合裡同時放「班」和「休假」：kind 為 "leave" 的是休假（沒有上下班時間）
const isLeave = s => s.kind === "leave";
const shiftsOnly = list => list.filter(s => !isLeave(s));
const leavesOnly = list => list.filter(isLeave);
const leaveLabel = s => s.leaveType || "休假";
// 居家上班：班多一個 remote: true
const isRemote = s => !isLeave(s) && !!s.remote;
const HOME_ICON = `<svg class="ico-home" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2 .8 7.4h2.2V14.8h3.9v-4.3h2.2v4.3h3.9V7.4h2.2z" fill="currentColor"/></svg>`;
const homeIcon = s => isRemote(s) ? HOME_ICON : "";
const homePill = s => isRemote(s) ? ` <span class="pill home">${HOME_ICON}居家</span>` : "";
// 月曆一頁從週一排到週日
function gridRange(month) {
  const [y, m] = month.split("-").map(Number);
  const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
  return { first, last, gridStart: addDays(first, -((first.getDay() + 6) % 7)), gridEnd: addDays(last, 6 - ((last.getDay() + 6) % 7)) };
}
// 依班表算工時提醒：單日 >10h、>12h、連續上班 7 天以上、雙週總時數 >80h
function analyzeSchedule(list, settings) {
  const per = {};   // uid -> { date: 當天排班工時 }
  for (const s of shiftsOnly(list)) { (per[s.uid] ??= {}); per[s.uid][s.date] = (per[s.uid][s.date] || 0) + shiftHours(s); }
  const dayFlags = {};   // "uid|date" -> [提醒]
  const add = (u, d, m) => (dayFlags[u + "|" + d] ??= []).push(m);
  for (const [u, dates] of Object.entries(per)) {
    for (const [d, h] of Object.entries(dates)) {
      if (h > 12) add(u, d, `當天排 ${fmtH(h)} 小時，超過含加班的 12 小時上限`);
      else if (h > 10) add(u, d, `當天排 ${fmtH(h)} 小時，超過變形工時單日正常工時 10 小時（超過部分算加班）`);
    }
    let run = 0, prev = null;
    for (const k of Object.keys(dates).sort()) {
      run = prev && fmtDate(addDays(parseDate(prev), 1)) === k ? run + 1 : 1;
      if (run >= 7) add(u, k, `連續上班第 ${run} 天（每 7 天至少要有 1 天例假）`);
      prev = k;
    }
  }
  const cycleFlags = [];
  if (settings?.cycleStart) {
    const base = parseDate(settings.cycleStart);
    for (const [u, dates] of Object.entries(per)) {
      const sums = {};
      for (const [d, h] of Object.entries(dates)) { const i = Math.floor(Math.round((parseDate(d) - base) / 864e5) / 14); sums[i] = (sums[i] || 0) + h; }
      for (const [i, h] of Object.entries(sums)) if (h > 80) { const from = addDays(base, Number(i) * 14); cycleFlags.push({ uid: u, from: fmtDate(from), to: fmtDate(addDays(from, 13)), hours: h }); }
    }
  }
  return { dayFlags, cycleFlags };
}

/* ---------- 示範模式（瀏覽器本機儲存） ---------- */
function makeDemoStore() {
  const mem = {};
  const get = (k, d) => { try { const v = localStorage.getItem("clockin_" + k); return v ? JSON.parse(v) : (mem[k] ?? d); } catch { return mem[k] ?? d; } };
  const set = (k, v) => { mem[k] = v; try { localStorage.setItem("clockin_" + k, JSON.stringify(v)); } catch {} };
  const toP = p => ({ ...p, ts: new Date(p.ts) });
  let me = null;
  return {
    mode: "demo",
    async init() { const sid = get("session", null); me = get("users", []).find(u => u.uid === sid) || null; return me && strip(me); },
    async adminCount() { return get("users", []).filter(u => u.role === "admin").length; },
    async signUp({ username, password, displayName, role }) {
      const users = get("users", []);
      if (users.some(u => u.username === username)) throw new Error("這個帳號已經有人使用");
      if (role === "admin" && users.filter(u => u.role === "admin").length >= MAX_ADMINS) throw new Error(`管理帳號已滿 ${MAX_ADMINS} 個，無法再申請`);
      const u = { uid: uuid(), username, displayName, role, hash: await sha256(username + ":" + password) };
      users.push(u); set("users", users); set("session", u.uid); me = u; return strip(u);
    },
    async signIn({ username, password }) {
      const u = get("users", []).find(x => x.username === username);
      if (!u || u.hash !== await sha256(username + ":" + password)) throw new Error("帳號或密碼錯誤");
      set("session", u.uid); me = u; return strip(u);
    },
    async signOut() { set("session", null); me = null; },
    async addPunch(type, uid = me.uid, at = null, reason = "") {
      const p = get("punches", []);
      p.push({ id: uuid(), uid, type, ts: (at || new Date()).getTime(), manual: !!at, by: me.uid, reason });
      set("punches", p);
    },
    async punchesFor(uid, start, end) { return get("punches", []).filter(p => p.uid === uid && p.ts >= +start && p.ts < +end).map(toP); },
    async punchesAll(start, end) { return get("punches", []).filter(p => p.ts >= +start && p.ts < +end).map(toP); },
    async deletePunch(id) { set("punches", get("punches", []).filter(p => p.id !== id)); },
    async listStaff() { return get("users", []).filter(u => u.role === "staff").map(strip); },
    async schedulesBetween(from, to) { return get("schedules", []).filter(s => s.date >= from && s.date <= to); },
    async addSchedules(items, delIds = []) { set("schedules", [...get("schedules", []).filter(s => !delIds.includes(s.id)), ...items.map(it => ({ ...it, id: uuid(), by: me.uid }))]); },
    async updateSchedule(id, fields) { set("schedules", get("schedules", []).map(s => s.id === id ? { ...s, ...fields, by: me.uid } : s)); },
    async deleteSchedule(id) { set("schedules", get("schedules", []).filter(s => s.id !== id)); },
    async getScheduleSettings() { return get("schedSettings", {}); },
    async saveScheduleSettings(v) { set("schedSettings", v); },
  };
}

/* ---------- 正式模式（Firebase） ---------- */
async function makeFirebaseStore(cfg) {
  const V = "10.12.2";
  const [{ initializeApp }, A, F] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  const email = u => `${u}@${EMAIL_DOMAIN}`;
  const adminsRef = F.doc(db, "meta", "admins");
  const punchesCol = F.collection(db, "punches");
  const schedCol = F.collection(db, "schedules");
  const schedSettingsRef = F.doc(db, "meta", "schedule");
  let me = null;

  const loadProfile = async uid => { const s = await F.getDoc(F.doc(db, "users", uid)); return s.exists() ? { uid, ...s.data() } : null; };
  const fromSnap = s => { const d = s.data(); return { id: s.id, uid: d.uid, type: d.type, ts: d.ts ? d.ts.toDate() : new Date(), manual: !!d.manual, by: d.by || "", reason: d.reason || "" }; };
  const mapErr = e => {
    const c = e?.code || "";
    if (c.includes("email-already-in-use")) return new Error("這個帳號已經有人使用");
    if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found") || c.includes("invalid-email")) return new Error("帳號或密碼錯誤");
    if (c.includes("weak-password")) return new Error("密碼至少要 6 個字元");
    if (c.includes("too-many-requests")) return new Error("嘗試太多次，請稍後再試");
    if (c.includes("permission-denied")) return new Error("沒有權限執行這個動作");
    return e;
  };

  return {
    mode: "firebase",
    async init() { await auth.authStateReady(); if (!auth.currentUser) return null; me = await loadProfile(auth.currentUser.uid); return me && strip(me); },
    async adminCount() { const s = await F.getDoc(adminsRef); return s.exists() ? (s.data().uids || []).length : 0; },
    async signUp({ username, password, displayName, role }) {
      if (role === "admin" && await this.adminCount() >= MAX_ADMINS) throw new Error(`管理帳號已滿 ${MAX_ADMINS} 個，無法再申請`);
      let cred;
      try { cred = await A.createUserWithEmailAndPassword(auth, email(username), password); } catch (e) { throw mapErr(e); }
      const uid = cred.user.uid;
      const profile = { username, displayName, role, createdAt: F.serverTimestamp() };
      try {
        if (role === "admin") {
          await F.runTransaction(db, async tx => {
            const s = await tx.get(adminsRef);
            const uids = s.exists() ? (s.data().uids || []) : [];
            if (uids.length >= MAX_ADMINS) throw new Error(`管理帳號已滿 ${MAX_ADMINS} 個，無法再申請`);
            if (s.exists()) tx.update(adminsRef, { uids: [...uids, uid] }); else tx.set(adminsRef, { uids: [uid] });
            tx.set(F.doc(db, "users", uid), profile);
          });
        } else {
          await F.setDoc(F.doc(db, "users", uid), profile);
        }
      } catch (e) { try { await cred.user.delete(); } catch {} throw mapErr(e); }
      me = { uid, ...profile }; return strip(me);
    },
    async signIn({ username, password }) {
      try { await A.signInWithEmailAndPassword(auth, email(username), password); } catch (e) { throw mapErr(e); }
      me = await loadProfile(auth.currentUser.uid);
      if (!me) { await A.signOut(auth); throw new Error("找不到這個帳號的資料"); }
      return strip(me);
    },
    async signOut() { await A.signOut(auth); me = null; },
    async addPunch(type, uid = me.uid, at = null, reason = "") {
      try {
        await F.addDoc(punchesCol, {
          uid, type, manual: !!at, by: auth.currentUser.uid, reason,
          ts: at ? F.Timestamp.fromDate(at) : F.serverTimestamp(),   // 員工打卡一律用伺服器時間，不能改手機時間作弊
        });
      } catch (e) { throw mapErr(e); }
    },
    async punchesFor(uid, start, end) {
      try {
        const q = F.query(punchesCol, F.where("uid", "==", uid), F.where("ts", ">=", F.Timestamp.fromDate(start)), F.where("ts", "<", F.Timestamp.fromDate(end)));
        return (await F.getDocs(q)).docs.map(fromSnap);
      } catch (e) {
        if (e.code !== "failed-precondition") throw mapErr(e);
        console.warn("尚未建立索引，請點 Firebase 錯誤訊息中的連結建立：", e.message);
        const q = F.query(punchesCol, F.where("uid", "==", uid));
        return (await F.getDocs(q)).docs.map(fromSnap).filter(p => p.ts >= start && p.ts < end);
      }
    },
    async punchesAll(start, end) {
      const q = F.query(punchesCol, F.where("ts", ">=", F.Timestamp.fromDate(start)), F.where("ts", "<", F.Timestamp.fromDate(end)));
      try { return (await F.getDocs(q)).docs.map(fromSnap); } catch (e) { throw mapErr(e); }
    },
    async deletePunch(id) { try { await F.deleteDoc(F.doc(db, "punches", id)); } catch (e) { throw mapErr(e); } },
    async listStaff() {
      const q = F.query(F.collection(db, "users"), F.where("role", "==", "staff"));
      return (await F.getDocs(q)).docs.map(s => strip({ uid: s.id, ...s.data() }));
    },
    /* 排班：另存在 schedules 集合（一個班一筆），設定存在 meta/schedule，不動 users / punches */
    async schedulesBetween(from, to) {
      try {
        const q = F.query(schedCol, F.where("date", ">=", from), F.where("date", "<=", to));
        return (await F.getDocs(q)).docs.map(s => { const d = s.data(); return { id: s.id, uid: d.uid, name: d.name || "", date: d.date, kind: d.kind || "shift", leaveType: d.leaveType || "", start: d.start || "", end: d.end || "", breakMin: d.breakMin || 0, remote: !!d.remote }; });
      } catch (e) { throw mapErr(e); }
    },
    // 新增多筆（班或休假）；delIds 是要一起刪掉的舊資料（例如設休假時刪掉當天的班），一次寫入
    async addSchedules(items, delIds = []) {
      const b = F.writeBatch(db);
      for (const id of delIds) b.delete(F.doc(db, "schedules", id));
      for (const it of items) b.set(F.doc(schedCol), { ...it, by: auth.currentUser.uid, updatedAt: F.serverTimestamp() });
      try { await b.commit(); } catch (e) { throw mapErr(e); }
    },
    async updateSchedule(id, fields) {
      try { await F.updateDoc(F.doc(db, "schedules", id), { ...fields, by: auth.currentUser.uid, updatedAt: F.serverTimestamp() }); } catch (e) { throw mapErr(e); }
    },
    async deleteSchedule(id) { try { await F.deleteDoc(F.doc(db, "schedules", id)); } catch (e) { throw mapErr(e); } },
    async getScheduleSettings() { try { const s = await F.getDoc(schedSettingsRef); return s.exists() ? s.data() : {}; } catch (e) { throw mapErr(e); } },
    async saveScheduleSettings(v) { try { await F.setDoc(schedSettingsRef, v); } catch (e) { throw mapErr(e); } },
  };
}

/* ---------- 工時計算 ----------
   每一段「上班 → 下班」算一個班次，歸在上班那天。
   工時 = 上班到下班，扣掉所有休息時間。
   沒有成對的打卡會標成「異常」，方便管理員補登。 */
function computeShifts(punches) {
  const list = [...punches].sort((a, b) => a.ts - b.ts);
  const shifts = [];
  let cur = null, seg = null, brk = null;
  const newShift = p => ({ date: fmtDate(p.ts), in: null, out: null, work: 0, brk: 0, breaks: [], punches: [], issue: "" });
  const finish = () => { if (cur) shifts.push(cur); cur = null; seg = null; brk = null; };

  for (const p of list) {
    const t = +p.ts;
    if (p.type === "in") {
      if (cur) { cur.issue = "沒打下班"; finish(); }
      cur = newShift(p); cur.in = p.ts; cur.punches.push(p); seg = t; continue;
    }
    if (!cur) { const o = newShift(p); o.punches.push(p); o.issue = "沒打上班"; if (p.type === "out") o.out = p.ts; shifts.push(o); continue; }
    cur.punches.push(p);
    if (p.type === "break_start") {
      if (seg != null) { cur.work += t - seg; seg = null; }
      if (brk == null) brk = t;
    } else if (p.type === "break_end") {
      if (brk != null) { cur.brk += t - brk; cur.breaks.push([new Date(brk), p.ts]); brk = null; }
      if (seg == null) seg = t;
    } else if (p.type === "out") {
      if (seg != null) cur.work += t - seg;
      if (brk != null) { cur.brk += t - brk; cur.breaks.push([new Date(brk), p.ts]); }
      cur.out = p.ts; finish();
    }
  }
  if (cur) {
    const lastT = +cur.punches[cur.punches.length - 1].ts;
    if (Date.now() - lastT < STALE_HOURS * 3600e3) { cur.ongoing = true; cur.openSeg = seg; cur.openBrk = brk; }
    else cur.issue = "沒打下班";
    shifts.push(cur);
  }
  return shifts;
}
const liveWork = s => s.work + (s.ongoing && s.openSeg != null ? Date.now() - s.openSeg : 0);
const liveBrk  = s => s.brk  + (s.ongoing && s.openBrk != null ? Date.now() - s.openBrk : 0);

/* ---------- 畫面：員工打卡 ---------- */
function staffState() {
  const shifts = computeShifts(S.mine);
  const last = shifts[shifts.length - 1];
  if (!last || !last.ongoing) return { state: "off", shifts };
  return { state: last.openBrk != null ? "break" : "work", shifts, current: last };
}

function viewStaff() {
  const { state, shifts, current } = staffState();
  const now = new Date();
  const today = fmtDate(now), month = fmtMonth(now);
  const todayShifts = shifts.filter(s => s.date === today);
  const monthShifts = shifts.filter(s => s.date.startsWith(month));
  const todayWork = todayShifts.reduce((a, s) => a + liveWork(s), 0);
  const monthWork = monthShifts.reduce((a, s) => a + liveWork(s), 0);
  const monthDays = new Set(monthShifts.filter(s => s.in).map(s => s.date)).size;
  const todayPunches = S.mine.filter(p => fmtDate(p.ts) === today).sort((a, b) => b.ts - a.ts);
  const pill = { off: `<span class="pill off">未上班</span>`, work: `<span class="pill work">工作中</span>`, break: `<span class="pill break">休息中</span>` }[state];
  const can = { in: state === "off", break_start: state === "work", break_end: state === "break", out: state !== "off" };
  const next = { off: "in", work: "out", break: "break_end" }[state];

  return `
  <div class="wrap mid">
    <div class="top">
      <div><h1>嗨，${esc(S.me.displayName)}</h1><div class="muted small">${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日 星期${WEEK[now.getDay()]}</div></div>
      <button class="btn" data-act="logout">登出</button>
    </div>
    <div class="card clock">
      ${pill}
      <div class="time" id="clock">${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}</div>
      ${current ? `<div class="muted small">今天 ${fmtTime(current.in)} 上班</div>` : `<div class="muted small">&nbsp;</div>`}
      <div class="punch">
        ${Object.entries(TYPES).map(([k, v]) => `<button data-act="punch" data-v="${k}" class="${k === next ? "go" : ""}" ${!can[k] || S.busy ? "disabled" : ""}>${v}</button>`).join("")}
      </div>
      ${S.msg ? `<div class="msg ${S.msg.kind}">${esc(S.msg.text)}</div>` : ""}
    </div>
    <div class="stats">
      <div class="stat"><span class="muted small">今日工時</span><b>${fmtDur(todayWork)}</b></div>
      <div class="stat"><span class="muted small">本月工時</span><b>${fmtDur(monthWork)}</b></div>
      <div class="stat"><span class="muted small">本月出勤</span><b>${monthDays} 天</b></div>
    </div>
    ${viewCrew()}
    ${viewStaffCal()}
    <div class="card">
      <h2>今天的打卡紀錄</h2>
      ${todayPunches.length ? `<ul class="list">${todayPunches.map(p => `<li><span>${TYPES[p.type]}${p.manual ? ` <span class="muted small">（${manualLabel(p)}）</span>` : ""}</span><b>${fmtTime(p.ts)}</b></li>`).join("")}</ul>` : `<div class="empty">今天還沒有打卡</div>`}
    </div>
    ${viewMyMonth()}
    ${viewFixForm()}
  </div>`;
}

/* 前台：今天上班的人員 + 我接下來的班 */
/* 24 小時制時間選擇：時（00–23）、分（每 5 分鐘）兩個下拉，實際值放在同名的隱藏欄位 */
function timePicker(name, value) {
  const [h, m] = /^\d{2}:\d{2}$/.test(value || "") ? value.split(":") : ["09", "30"];
  const hours = Array.from({ length: 24 }, (_, i) => pad(i));
  const mins = Array.from({ length: 12 }, (_, i) => pad(i * 5));
  if (!mins.includes(m)) { mins.push(m); mins.sort(); }   // 舊資料不是 5 分鐘整數也保留
  const opts = (arr, cur) => arr.map(v => `<option${v === cur ? " selected" : ""}>${v}</option>`).join("");
  return `<div class="tp">
    <select data-tp="h" aria-label="時">${opts(hours, h)}</select><span>:</span>
    <select data-tp="m" aria-label="分">${opts(mins, m)}</select>
    <input type="hidden" name="${name}" value="${h}:${m}">
  </div>`;
}

  return `<div><div class="seg vseg">${b("all", "全部")}${b("work", "上班")}${b("off", "休假")}</div></div>`;
}
const byMode = (where, items) => S.calView[where] === "work" ? shiftsOnly(items) : S.calView[where] === "off" ? leavesOnly(items) : items;
// 全員休假：這天沒有人上班，而且名單上每個人都有請假
function isAllOff(dayAll, roster) {
  if (!roster.length || shiftsOnly(dayAll).length) return false;
  const off = new Set(leavesOnly(dayAll).map(s => s.uid));
  return roster.every(uid => off.has(uid));
}
const leaveChip = (s, name, extra = "", draggable = false) => `<div class="sc off${extra}"${draggable ? ` data-sid="${esc(s.id)}"` : ""} title="${esc(`${name} ${leaveLabel(s)}`)}">${esc(name)} 休</div>`;
const ALL_OFF_CHIP = `<div class="sc off alloff">全員休假</div>`;
function dayCount(where, items) {
  const n = S.calView[where] === "off" ? leavesOnly(items).length : shiftsOnly(items).length;
  return n ? `<span>${n} ${S.calView[where] === "off" ? "休" : "人"}</span>` : "";
}

/* 前台：整個月的班表（只能看，不能改） */
function viewStaffCal() {
  const C = S.staffCal;
  const { first, gridStart, gridEnd } = gridRange(C.month);
  const today = fmtDate(new Date());
  const byDate = {}, allByDate = {};
  const hid = S.calHide.staff;
  for (const s of C.list || []) { (allByDate[s.date] ??= []).push(s); if (!hid.has(s.uid)) (byDate[s.date] ??= []).push(s); }
  // 開關列：本月有出現的人（自己排第一個）
  const seen = new Map();
  for (const s of [...(C.list || [])].sort((a, b) => (a.uid === S.me.uid ? -1 : b.uid === S.me.uid ? 1 : (a.name || "").localeCompare(b.name || "", "zh-Hant"))))
    if (!seen.has(s.uid)) seen.set(s.uid, { uid: s.uid, name: s.name || "（未知）" });
  if (!seen.has(S.me.uid)) seen.set(S.me.uid, { uid: S.me.uid, name: S.me.displayName });
  const roster = [...seen.keys()];
  const sortDay = arr => [...shiftsOnly(arr).sort(byStart), ...leavesOnly(arr).sort((a, b) => (a.name || "").localeCompare(b.name || "", "zh-Hant"))];
  let cells = "一二三四五六日".split("").map(d => `<div class="dow">${d}</div>`).join("");
  for (let d = new Date(gridStart); d <= gridEnd; d = addDays(d, 1)) {
    const k = fmtDate(d);
    const allOff = isAllOff(allByDate[k] || [], roster);
    const items = allOff ? [] : byMode("staff", sortDay(byDate[k] || []));
    const chips = allOff ? ALL_OFF_CHIP : items.slice(0, MAX_CHIPS).map(s => {
      const me = s.uid === S.me.uid ? " me" : "";
      return isLeave(s)
        ? leaveChip(s, s.name || "（未知）", me)
        : `<div class="sc${me}" style="--pc:${pcolor(s.uid)}"${isRemote(s) ? ` title="居家上班"` : ""}>${homeIcon(s)}${esc(s.name || "（未知）")} <span class="t">${s.start}–${s.end}</span></div>`;
    }).join("");
    cells += `<div class="day${d.getMonth() !== first.getMonth() ? " other" : ""}${k === today ? " today" : ""}${k === C.sel ? " sel" : ""}" data-act="cday" data-v="${k}">
      <div class="dnum">${d.getDate()}${allOff ? "" : dayCount("staff", items)}</div>
      ${chips}${items.length > MAX_CHIPS ? `<div class="more">+${items.length - MAX_CHIPS}</div>` : ""}
    </div>`;
  }
  // 選到的那天：完整名單和時間
  const selItems = sortDay(byDate[C.sel] || []);
  const selWork = shiftsOnly(selItems), selOff = leavesOnly(selItems);
  const mode = S.calView.staff;
  const selAllOff = isAllOff(allByDate[C.sel] || [], roster);
  const detail = !C.sel ? "" : `
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <h2 style="font-size:15px;margin:0 0 4px">${dayLabel(C.sel)}${C.sel === today ? "・今天" : ""}${selAllOff ? ` <span class="pill off">全員休假</span>` : ""}</h2>
      ${mode === "off" ? "" : selWork.length ? `<ul class="list">${selWork.map(s => `<li><span class="rowl who">
          <span class="dotname" style="--pc:${pcolor(s.uid)}">${esc((s.name || "?").slice(0, 1))}</span>
          <span><b>${esc(s.name || "（未知）")}</b>${s.uid === S.me.uid ? ` <span class="pill work">你</span>` : ""}${homePill(s)}</span></span>
          <b>${shiftLabel(s)}</b></li>`).join("")}</ul>` : `<div class="small muted" style="padding:8px 0">這天沒有人排班</div>`}
      ${mode === "work" ? "" : selOff.length ? `<div class="small muted" style="margin-top:6px">休假：${selOff.map(s => `${esc(s.name || "（未知）")}${s.uid === S.me.uid ? "（你）" : ""}（${esc(leaveLabel(s))}）`).join("、")}</div>`
        : mode === "off" ? `<div class="small muted" style="padding:8px 0">這天沒有人休假</div>` : ""}
    </div>`;
  return `
  <div class="card" style="margin-bottom:16px">
    <div class="cardhead">
      <h2>${first.getFullYear()} 年 ${first.getMonth() + 1} 月班表</h2>
      <div style="display:flex;gap:6px">
        <button class="btn sm" data-act="cmonth" data-v="-1" aria-label="上個月">‹</button>
        <button class="btn sm" data-act="cmonth" data-v="0">本月</button>
        <button class="btn sm" data-act="cmonth" data-v="1" aria-label="下個月">›</button>
      </div>
    </div>
    ${C.err ? `<div class="empty">${esc(C.err)}</div>` : !C.list ? `<div class="empty">讀取中…</div>` : `
      ${viewModeBar("staff")}
      ${viewPeopleFilter("staff", [...seen.values()])}
      <div class="cal compact">${cells}</div>
      <p class="small muted" style="margin:8px 0 0">點任一天可以看那天誰上班、幾點到幾點。粗框是你自己的班，有小房子的是居家上班。</p>
      ${detail}`}
  </div>`;
}

function viewCrew() {

}

function viewMyMonth() {
  const sh = S.myShifts;

/* 每日明細表（前台、後台共用） */
const manualLabel = p => !p.manual ? "" : (p.by && p.by === p.uid ? "員工補登" : "管理員補登");
function shiftTable(shifts, keyPrefix, canDelete) {
  if (!shifts.length) return `<div class="empty">這個月沒有打卡紀錄</div>`;
  return `<div class="tablewrap"><table>
    <thead><tr><th>日期</th><th>上班</th><th>下班</th><th>休息時段</th><th class="right">休息</th><th class="right">工時</th><th>狀態</th></tr></thead>
    <tbody>
    ${shifts.map((s, i) => {
      const key = keyPrefix + ":" + i;
      const st = (s.ongoing ? `<span class="pill work">進行中</span>` : s.issue ? `<span class="pill bad">${s.issue}</span>` : `<span class="muted small">正常</span>`)
        + (s.punches.some(p => p.manual) ? ` <span class="pill break">含補登</span>` : "");
      const row = `<tr class="click" data-act="toggle" data-v="${esc(key)}">
        <td>${dayLabel(s.date)}</td><td>${fmtTime(s.in)}</td><td>${fmtTime(s.out)}</td>
        <td class="small">${s.breaks.length ? s.breaks.map(b => `${fmtTime(b[0])}–${fmtTime(b[1])}`).join("、") : `<span class="muted">—</span>`}</td>
        <td class="right">${fmtDur(liveBrk(s))}</td><td class="right"><b>${fmtDur(liveWork(s))}</b></td><td>${st}</td></tr>`;
      const raw = S.open.has(key) ? `<tr class="raw"><td colspan="7"><span class="small muted">原始打卡：</span>${s.punches.map(p =>
        `<span class="chip">${TYPES[p.type]} ${fmtTime(p.ts)}${p.manual ? `（${manualLabel(p)}${p.reason ? `：${esc(p.reason)}` : ""}）` : ""}${canDelete(p) ? `<button title="刪除" data-act="del" data-v="${esc(p.id)}">✕</button>` : ""}</span>`).join("")}</td></tr>` : "";
      return row + raw;
    }).join("")}
    </tbody>
  </table></div>`;
}

  const tot = A.rows.reduce((a, r) => ({ work: a.work + r.work, brk: a.brk + r.brk, days: a.days + r.days, issues: a.issues + r.issues }), { work: 0, brk: 0, days: 0, issues: 0 });

/* ---------- 畫面：排班表 ---------- */
const staffName = uid => S.sched?.staff.find(u => u.uid === uid)?.displayName;
const schedName = s => staffName(s.uid) || s.name || "（已刪除的帳號）";

function viewSchedule() {
  const P = S.sched;
  if (!P) return `<div class="card"><div class="empty">讀取中…</div></div>`;
  const { first, gridStart, gridEnd } = gridRange(S.month);
  const { dayFlags } = analyzeSchedule(P.list, P.settings);
  const today = fmtDate(new Date());
  const byDate = {}, allByDate = {};
  for (const s of P.list) { (allByDate[s.date] ??= []).push(s); if (!S.calHide.admin.has(s.uid)) (byDate[s.date] ??= []).push(s); }
  const roster = P.staff.map(u => u.uid);
  let cells = "一二三四五六日".split("").map(d => `<div class="dow">${d}</div>`).join("");
  for (let d = new Date(gridStart); d <= gridEnd; d = addDays(d, 1)) {
    const k = fmtDate(d);
    const shifts = shiftsOnly(byDate[k] || []).sort(byStart);
    const leaves = leavesOnly(byDate[k] || []).sort((a, b) => schedName(a).localeCompare(schedName(b), "zh-Hant"));
    const allOff = isAllOff(allByDate[k] || [], roster);
    const items = allOff ? [] : byMode("admin", [...shifts, ...leaves]);
    const chips = allOff ? ALL_OFF_CHIP : items.slice(0, MAX_CHIPS).map(s => {
      const name = schedName(s);
      if (isLeave(s)) return leaveChip(s, name, "", true);
      const fl = dayFlags[s.uid + "|" + k];
      const tip = `${name} ${shiftLabel(s)}${isRemote(s) ? "（居家）" : ""}，排 ${fmtH(shiftHours(s))} 小時${fl ? "\n" + fl.join("\n") : ""}`;
      return `<div class="sc${fl ? " flag" : ""}" data-sid="${esc(s.id)}" style="--pc:${pcolor(s.uid)}" title="${esc(tip)}">${homeIcon(s)}${esc(name)} <span class="t">${s.start}–${s.end}</span></div>`;
    }).join("");
    cells += `<div class="day${d.getMonth() !== first.getMonth() ? " other" : ""}${k === today ? " today" : ""}" data-act="sday" data-v="${k}">
      <div class="dnum">${d.getDate()}${allOff ? "" : dayCount("admin", items)}</div>
      ${chips}${items.length > MAX_CHIPS ? `<div class="more">還有 ${items.length - MAX_CHIPS} 筆</div>` : ""}
    </div>`;
  }
  return `
  <div class="card">
    <div class="cardhead">
      <h2>${first.getFullYear()} 年 ${first.getMonth() + 1} 月班表</h2>
      <div style="display:flex;gap:6px">
        <button class="btn sm" data-act="smonth" data-v="-1">‹ 上個月</button>
        <button class="btn sm" data-act="smonth" data-v="0">本月</button>
        <button class="btn sm" data-act="smonth" data-v="1">下個月 ›</button>
      </div>
    </div>
    ${P.err ? `<div class="msg err" style="margin:0 0 12px">${esc(P.err)}</div>` : ""}
    ${viewModeBar("admin")}
    ${viewPeopleFilter("admin", P.staff.map(u => ({ uid: u.uid, name: u.displayName })))}
    <div class="cal">${cells}</div>
    <p class="small muted" style="margin:12px 0 0">點任一天就能排班或設定休假。按住已排的班或休假可以拖到別天（手機請長按再拖），放開後選複製或移動。有小房子的是居家上班；虛線框「名字 休」是休假（假別在點進去的那天可以看到）；標「!」的班有工時提醒，點進去可以看原因。</p>
  </div>
  ${viewSchedSummary()}
  ${viewSchedColors()}
  ${viewSchedSettings()}`;
}

function viewSchedColors() {
  const P = S.sched;
  if (!P.staff.length) return "";
  const custom = P.settings.colors || {};
  return `
  <div class="card" style="margin-top:16px">
    <h2 style="margin-bottom:4px">人員顏色</h2>
    <div class="small muted" style="margin-bottom:8px">點色塊就能換顏色，班表、統計和前台都會一起換。</div>
    <div class="colors">${P.staff.map(u => `

function viewSchedSummary() {
  const P = S.sched;
  const { first, last } = gridRange(S.month);
  const mFrom = fmtDate(first), mTo = fmtDate(last);
  const { dayFlags, cycleFlags } = analyzeSchedule(P.list, P.settings);
  const stats = {};
  const ensure = uid => (stats[uid] ??= { days: new Set(), hours: 0, off: new Set(), home: new Set() });
  P.staff.forEach(u => ensure(u.uid));
  for (const s of P.list) if (s.date >= mFrom && s.date <= mTo) {
    const st = ensure(s.uid);
    if (isLeave(s)) { st.off.add(s.date); continue; }
    st.days.add(s.date); st.hours += shiftHours(s); if (isRemote(s)) st.home.add(s.date);
  }
  const uids = Object.keys(stats);
  if (!uids.length) return `<div class="card" style="margin-top:16px"><div class="empty">還沒有員工帳號。請員工到前台「申請員工帳號」，申請後就能排班。</div></div>`;

  const warns = [];
  for (const [key, msgs] of Object.entries(dayFlags).sort()) {
    const [uid, d] = key.split("|");
    if (d < mFrom || d > mTo) continue;
    for (const m of msgs) warns.push({ uid, text: `${schedName({ uid })} ${dayLabel(d)}：${m}` });
  }
  for (const c of cycleFlags) if (c.to >= mFrom && c.from <= mTo)
    warns.push({ uid: c.uid, text: `${schedName({ uid: c.uid })} 週期 ${c.from.slice(5)}～${c.to.slice(5)}：共排 ${fmtH(c.hours)} 小時，超過雙週 80 小時上限` });
  const wc = {};
  warns.forEach(w => wc[w.uid] = (wc[w.uid] || 0) + 1);

  const actual = Object.fromEntries((P.rows || []).map(r => [r.user.uid, r.work]));
  const rows = uids.map(uid => ({ uid, name: schedName({ uid }), days: stats[uid].days.size, home: stats[uid].home.size, off: stats[uid].off.size, hours: stats[uid].hours, actual: actual[uid] }))
    .sort((a, b) => b.hours - a.hours || a.name.localeCompare(b.name, "zh-Hant"));
  const tot = rows.reduce((a, r) => ({ days: a.days + r.days, off: a.off + r.off, hours: a.hours + r.hours, actual: a.actual + (r.actual || 0) }), { days: 0, off: 0, hours: 0, actual: 0 });
  return `
  <div class="card" style="margin-top:16px">
    <h2>${first.getMonth() + 1} 月排班時數</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>姓名</th><th class="right">排班天數</th><th class="right">休假天數</th><th class="right">排班時數</th><th class="right">實際工時</th><th class="right">提醒</th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td><span class="sc" style="--pc:${pcolor(r.uid)};display:inline-block;font-size:13px">${esc(r.name)}</span></td>
        <td class="right">${r.days}${r.home ? `<span class="small muted">（居家 ${r.home}）</span>` : ""}</td><td class="right">${r.off || `<span class="muted">—</span>`}</td><td class="right"><b>${fmtH(r.hours)}</b></td>
        <td class="right">${r.actual == null ? `<span class="muted">—</span>` : toHours(r.actual)}</td>
        <td class="right">${wc[r.uid] ? `<span class="pill bad">${wc[r.uid]}</span>` : `<span class="muted">—</span>`}</td></tr>`).join("")}
      </tbody>
      <tfoot><tr><td>合計</td><td class="right">${tot.days}</td><td class="right">${tot.off}</td><td class="right">${fmtH(tot.hours)}</td><td class="right">${toHours(tot.actual)}</td><td></td></tr></tfoot>
    </table></div>
    ${warns.length ? `<ul class="warns">${warns.map(w => `<li>${esc(w.text)}</li>`).join("")}</ul>` : ""}
    <p class="small muted" style="margin:12px 0 0">排班時數已扣掉休息時間；實際工時就是「出勤總覽」的總工時（上班到下班扣掉休息）。${P.settings.cycleStart ? "" : "在下方填雙週變形工時的週期起始日後，也會檢查每兩週 80 小時上限。"}</p>
  </div>`;
}

function calcLine(f) {
  if (!f.start || !f.end) return "";
  if (f.start === f.end) return `<span class="w">上班和下班時間不能一樣</span>`;
  const h = shiftHours(f);
  let t = `排班工時 <b>${fmtH(h)}</b> 小時（已扣休息 ${Number(f.breakMin) || 0} 分鐘）`;
  if (isOvernight(f)) t += "・跨夜班，下班時間算到隔天";
  if (h > 12) t += `<br><span class="w">超過含加班的 12 小時上限</span>`;
  else if (h > 10) t += `<br><span class="w">超過變形工時單日正常工時 10 小時，超過部分要算加班</span>`;
  return t;
}

/* ---------- 資料載入 ---------- */
async function loadMine() {
  const end = new Date(Date.now() + 60000);
  const start = new Date(); start.setDate(start.getDate() - 40); start.setHours(0, 0, 0, 0);
  S.mine = await S.store.punchesFor(S.me.uid, start, end);
}

async function loadMyMonth() {
  const [y, m] = S.myMonth.split("-").map(Number);
  const start = new Date(y, m - 1, 1), end = new Date(y, m, 1);
  const margin = STALE_HOURS * 3600e3;
  try {
    const ps = await S.store.punchesFor(S.me.uid, new Date(+start - margin), new Date(Math.min(+end + margin, Date.now() + 60000)));
    S.myShifts = computeShifts(ps).filter(s => s.date.startsWith(S.myMonth));
  } catch (e) {
    S.myShifts = [];
    S.fixMsg = { text: "讀取明細失敗：" + (e.message || e), kind: "err" };
  }
}

// 前台用：今天上班的人員、我接下來兩週的班
async function loadStaffSchedule() {
  const today = fmtDate(new Date());
  S.store.getScheduleSettings().then(st => { S.colors = st.colors || {}; render(); }).catch(() => {});   // 只用來顯示人員顏色
  try {
    const list = await S.store.schedulesBetween(today, fmtDate(addDays(new Date(), 13)));
    const todays = list.filter(s => s.date === today);
    S.crew = shiftsOnly(todays).sort(byStart);
    S.offToday = leavesOnly(todays);
    S.myUpcoming = list.filter(s => s.uid === S.me.uid).sort(byStart);
    S.crewErr = null;
  } catch (e) {
    S.crew = []; S.offToday = []; S.myUpcoming = [];
    S.crewErr = "讀不到班表";
    console.warn("讀取班表失敗（如果還沒更新 Firestore 規則，這是正常的）：", e);
  }
}

// 前台月班表：抓整頁月曆範圍（含前後補滿的那幾天）
async function loadStaffCal() {
  const C = S.staffCal, month = C.month;
  const { gridStart, gridEnd } = gridRange(month);
  try {
    const list = await S.store.schedulesBetween(fmtDate(gridStart), fmtDate(gridEnd));
    if (month !== S.staffCal.month) return;   // 讀取中又切了月份
    C.list = list; C.err = null;
  } catch (e) {
    C.list = []; C.err = "讀不到班表";
    console.warn("讀取月班表失敗：", e);
  }
}

async function reloadStaff() {
  await Promise.all([loadMine(), loadMyMonth(), loadStaffSchedule(), loadStaffCal()]);
}

// 某月份每位員工的出勤統計（出勤總覽和排班表共用）
async function fetchAdminRows(month) {
  const [y, m] = month.split("-").map(Number);
  const start = new Date(y, m - 1, 1), end = new Date(y, m, 1);
  const margin = STALE_HOURS * 3600e3;   // 抓前後一點，跨午夜的班次才不會被切斷
  const [staff, punches] = await Promise.all([S.store.listStaff(), S.store.punchesAll(new Date(+start - margin), new Date(+end + margin))]);
  const byUid = {};
  for (const p of punches) (byUid[p.uid] ??= []).push(p);
  return staff.map(user => {
    const shifts = computeShifts(byUid[user.uid] || []).filter(s => s.date.startsWith(month));
    return {
      user, shifts,
      work: shifts.reduce((a, s) => a + liveWork(s), 0),
      brk: shifts.reduce((a, s) => a + liveBrk(s), 0),
      days: new Set(shifts.filter(s => s.in).map(s => s.date)).size,
      issues: shifts.filter(s => s.issue).length,
      fixes: shifts.flatMap(s => s.punches).filter(p => p.manual && p.by === p.uid).length,
    };
  }).sort((a, b) => a.user.displayName.localeCompare(b.user.displayName, "zh-Hant"));
}

async function loadAdmin() {
  S.admin = null; render();
  try {
    S.admin = { rows: await fetchAdminRows(S.month), month: S.month };
  } catch (e) {
    S.admin = { rows: [], month: S.month };
    S.adminMsg = { text: "讀取失敗：" + (e.message || e), kind: "err" };
  }
  render();
}

const RULES_HINT = "（如果是「沒有權限」，請確認 Firestore 規則已經加上排班的部分，見 README）";
function schedRange() { const { gridStart, gridEnd } = gridRange(S.month); return [fmtDate(addDays(gridStart, -13)), fmtDate(addDays(gridEnd, 13))]; }

// 排班表：班表（多抓前後 13 天，才能檢查跨月的連續上班和雙週時數）＋ 設定 ＋ 實際工時
async function loadSchedule() {
  S.sched = null; render();
  const month = S.month;
  const [list, settings, rows] = await Promise.allSettled([
    S.store.schedulesBetween(...schedRange()), S.store.getScheduleSettings(), fetchAdminRows(month),
  ]);
  if (month !== S.month) return;   // 讀取中又切了月份
  if (rows.status === "fulfilled") S.admin = { rows: rows.value, month };
  if (settings.status === "fulfilled") S.colors = settings.value.colors || {};
  S.sched = {
    list: list.status === "fulfilled" ? list.value : [],
    settings: { ...SCHED_DEFAULTS, ...(settings.status === "fulfilled" ? settings.value : {}) },
    settingsOk: settings.status === "fulfilled",   // 讀不到設定時不准存，避免把已存的設定蓋掉
    rows: rows.status === "fulfilled" ? rows.value : [],
    staff: rows.status === "fulfilled" ? rows.value.map(r => r.user) : [],
    err: list.status === "rejected" ? "讀取班表失敗：" + (list.reason?.message || list.reason) + RULES_HINT
       : rows.status === "rejected" ? "讀取員工資料失敗：" + (rows.reason?.message || rows.reason) : null,
  };
  if (rows.status === "rejected") { try { S.sched.staff = await S.store.listStaff(); } catch {} }
  render();
}

// 存檔後只重抓班表，不重畫整個讀取中畫面
async function refreshSchedList() {
  try { S.sched.list = await S.store.schedulesBetween(...schedRange()); S.sched.err = null; }
  catch (e) { S.sched.err = "讀取班表失敗：" + (e.message || e) + RULES_HINT; }
}

// 存某個人的顏色（hex 為 null 代表恢復自動配色）；整份設定一起寫回，不會動到預設時間
async function saveColor(uid, hex) {
  if (!S.sched.settingsOk) { S.schedMsg = { text: "讀不到目前的設定，為了避免覆蓋，請按「重新整理」後再改顏色", kind: "err" }; render(); return; }
  const colors = { ...(S.sched.settings.colors || {}) };
  if (hex && isHex(hex)) colors[uid] = hex.toLowerCase(); else delete colors[uid];
  const v = { ...S.sched.settings, colors };
  S.busy = true; render();
  try { await S.store.saveScheduleSettings(v); S.sched.settings = v; S.colors = colors; S.schedMsg = null; }
  catch (err) { S.schedMsg = { text: "顏色儲存失敗：" + (err.message || err) + RULES_HINT, kind: "err" }; window.scrollTo(0, 0); }
  S.busy = false; render();
}

function openDay(date, editId = null, mode = "shift") {
  const st = S.sched.settings;
  const leaveType = S.day?.leaveType || LEAVE_TYPES[0];
  S.day = { date, mode, leaveType, editId: null, pick: new Set(), form: { start: st.start, end: st.end, breakMin: Number(st.breakMin) || 0, remote: false }, msg: null };
  if (editId) {
    const s = S.sched.list.find(x => x.id === editId);
    if (s) Object.assign(S.day, { editId, pick: new Set([s.uid]), form: { start: s.start, end: s.end, breakMin: Number(s.breakMin) || 0, remote: !!s.remote } });
  }
}

function exportCSV() {
  const lines = [];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  lines.push([`${S.month} 月總覽`].map(q).join(","));
  lines.push(["姓名", "帳號", "出勤天數", "總工時(時:分)", "總工時(小時)", "總休息(小時)", "員工補登筆數", "異常筆數"].map(q).join(","));
  for (const r of S.admin.rows) lines.push([r.user.displayName, r.user.username, r.days, fmtDur(r.work), toHours(r.work), toHours(r.brk), r.fixes, r.issues].map(q).join(","));
  lines.push("");
  lines.push(["每日明細"].map(q).join(","));
  lines.push(["姓名", "日期", "上班", "下班", "休息時段", "休息(小時)", "工時(時:分)", "工時(小時)", "狀態"].map(q).join(","));
  for (const r of S.admin.rows) for (const s of r.shifts)
    lines.push([r.user.displayName, s.date, fmtTime(s.in), fmtTime(s.out), s.breaks.map(b => `${fmtTime(b[0])}-${fmtTime(b[1])}`).join(" "), toHours(liveBrk(s)), fmtDur(liveWork(s)), toHours(liveWork(s)), (s.ongoing ? "進行中" : (s.issue || "正常")) + (s.punches.some(p => p.manual) ? "・含補登" : "")].map(q).join(","));
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `打卡工時_${S.month}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function render() {
  // 重新畫面時保留表單裡已經填的內容
  const saved = {};
  for (const id of ["fixForm", "addForm"]) {
    const f = document.getElementById(id);
    if (f) saved[id] = [...f.elements].filter(el => el.name).map(el => [el.name, el.value]);

  if (!S.me) app.innerHTML = viewLogin();
  else if (S.me.role === "admin") app.innerHTML = viewAdmin();

    const f = document.getElementById(id);
    if (f) for (const [n, v] of vals) if (f.elements[n]) f.elements[n].value = v;
  }
}

/* ---------- 排班表：拖曳班次到別天 ----------
   電腦：按住滑鼠拖；手機：長按 0.35 秒後再拖（不長按就是一般捲動）。
   放開在另一天就跳出「複製／移動」。拖曳中不重畫畫面，結束後才更新。 */
const drag = { s: null, active: false, ghost: null, over: null, x0: 0, y0: 0, x: 0, y: 0, timer: null, suppress: false };

function dragStart(chip, x, y) {
  if (S.me?.role !== "admin" || S.adminTab !== "schedule" || S.busy || S.day || S.dropAsk) return false;
  const s = S.sched?.list.find(it => it.id === chip.dataset.sid);
  if (!s) return false;
  Object.assign(drag, { s, chip, active: false, x0: x, y0: y, x, y });
  return true;
}
function dragBegin() {
  drag.active = true;
  const r = drag.chip.getBoundingClientRect();
  const g = drag.chip.cloneNode(true);
  g.classList.add("ghost"); g.classList.remove("flag");
  g.style.width = Math.max(r.width, 90) + "px";
  document.body.appendChild(g);
  drag.ghost = g;
  drag.chip.classList.add("dragging");
  document.body.classList.add("is-dragging");
  dragMove(drag.x, drag.y);
}
function dragMove(x, y) {
  drag.x = x; drag.y = y;
  if (!drag.active) return;
  drag.ghost.style.transform = `translate(${x + 10}px, ${y + 10}px)`;
  const day = document.elementFromPoint(x, y)?.closest(".cal .day[data-v]") || null;
  if (day !== drag.over) { drag.over?.classList.remove("drop-over"); drag.over = day; day?.classList.add("drop-over"); }
}
function dragEnd(cancel = false) {
  clearTimeout(drag.timer);
  const { s, active, over } = drag;
  drag.ghost?.remove(); over?.classList.remove("drop-over"); drag.chip?.classList.remove("dragging");
  document.body.classList.remove("is-dragging");
  Object.assign(drag, { s: null, chip: null, active: false, ghost: null, over: null, timer: null });
  if (!active) return;
  drag.suppress = true; setTimeout(() => { drag.suppress = false; }, 400);   // 放開時不要順便打開那天的視窗
  const to = over?.dataset.v;
  if (cancel || !s || !to || to === s.date) return;
  askDrop(s, to);
}
function askDrop(s, to) {
  const list = S.sched.list;
  if (isLeave(s)) {
    // 休假：那天已經休假就擋下；那天有班的話，確認後會一起刪掉那個班
    if (list.some(x => x.date === to && x.uid === s.uid && isLeave(x))) {
      S.schedMsg = { text: `${schedName(s)} ${dayLabel(to)} 已經是休假了`, kind: "err" };
      render(); return;
    }
    const clash = shiftsOnly(list).filter(x => x.date === to && x.uid === s.uid);
    S.schedMsg = null;
    S.dropAsk = { s, to, clash: clash.map(x => x.id),
      note: clash.length ? `${schedName(s)} ${dayLabel(to)} 有 ${clash.map(shiftLabel).join("、")} 的班，放休假會一併刪除這個班` : "" };
    render(); return;
  }
  if (list.some(x => x.date === to && x.uid === s.uid && isLeave(x))) {
    S.schedMsg = { text: `${schedName(s)} ${dayLabel(to)} 休假，不能排班（要排請先取消休假）`, kind: "err" };
    render(); return;
  }
  const same = shiftsOnly(list).filter(x => x.date === to && x.uid === s.uid);
  S.schedMsg = null;
  S.dropAsk = { s, to, note: same.length ? `${schedName(s)} ${dayLabel(to)} 已經有 ${same.map(shiftLabel).join("、")} 的班` : "" };
  render();
}

// 滑鼠
app.addEventListener("pointerdown", e => {
  drag.suppress = false;   // 新的一次點擊開始了，不再擋
  if (e.pointerType !== "mouse" || e.button !== 0) return;
  const chip = e.target.closest(".cal [data-sid]");
  if (chip && dragStart(chip, e.clientX, e.clientY)) e.preventDefault();   // 避免拖的時候選到文字
});
window.addEventListener("pointermove", e => {
  if (!drag.s || e.pointerType !== "mouse") return;
  if (!drag.active && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 5) { drag.x = e.clientX; drag.y = e.clientY; dragBegin(); }
  dragMove(e.clientX, e.clientY);
});
window.addEventListener("pointerup", e => { if (drag.s && e.pointerType === "mouse") { dragMove(e.clientX, e.clientY); dragEnd(); } });
window.addEventListener("keydown", e => { if (e.key === "Escape" && drag.active) dragEnd(true); });

// 手機：長按才開始拖
app.addEventListener("touchstart", e => {
  drag.suppress = false;
  if (e.touches.length !== 1) return;
  const chip = e.target.closest(".cal [data-sid]");
  const t = e.touches[0];
  if (!chip || !dragStart(chip, t.clientX, t.clientY)) return;
  drag.timer = setTimeout(() => { if (drag.s) { dragBegin(); navigator.vibrate?.(15); } }, 350);
}, { passive: true });
window.addEventListener("touchmove", e => {
  if (!drag.s) return;
  const t = e.touches[0];
  if (!drag.active) {   // 還沒長按就移動 = 在捲動畫面，取消拖曳
    if (Math.hypot(t.clientX - drag.x0, t.clientY - drag.y0) > 10) dragEnd(true);
    return;
  }
  e.preventDefault();
  dragMove(t.clientX, t.clientY);
}, { passive: false });
window.addEventListener("touchend", e => { if (!drag.s) return; if (drag.active) e.preventDefault(); dragEnd(); });
window.addEventListener("touchcancel", () => { if (drag.s) dragEnd(true); });
window.addEventListener("contextmenu", e => { if (drag.s) e.preventDefault(); });   // 長按時不要跳出系統選單

app.addEventListener("click", async e => {
  // 剛拖完放開時瀏覽器會補一個點擊，擋掉它以免打開那天的視窗；但視窗裡的按鈕照常可以按
  if (drag.suppress && !e.target.closest(".modal")) { drag.suppress = false; e.preventDefault(); return; }
  // 點視窗外面的灰色區域就關閉
  if (e.target.matches?.(".modal-bg[data-close]")) { S.day = null; S.dropAsk = null; render(); return; }
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;

  /* ----- 排班 ----- */
  if (act === "cv") { S.calView[el.dataset.w] = v; saveView(el.dataset.w); render(); return; }   // 全部／上班／休假
  if (act === "pf") {   // 月曆人員開關
    const w = el.dataset.w, hid = S.calHide[w];
    if (v === "__all") hid.clear();
    else if (v === "__me") { hid.clear(); for (const s of S.staffCal.list || []) if (s.uid !== S.me.uid) hid.add(s.uid); }
    else hid.has(v) ? hid.delete(v) : hid.add(v);
    saveHidden(w); render(); return;
  }
  if (act === "dropcancel") { S.dropAsk = null; render(); return; }
  if (act === "dropdo") {
    if (!S.dropAsk || S.busy) return;
    const { s, to } = S.dropAsk;
    S.busy = true; render();
    try {
      const name = staffName(s.uid) || s.name || "";
      if (isLeave(s)) {
        // 休假：新增一筆到目標日，並一次刪掉目標日的班（移動的話連原本的休假也刪）
        const clash = S.dropAsk.clash || [];
        await S.store.addSchedules([{ uid: s.uid, name, date: to, kind: "leave", leaveType: leaveLabel(s) }], v === "move" ? [s.id, ...clash] : clash);
      }
      else if (v === "move") await S.store.updateSchedule(s.id, { date: to });
      else await S.store.addSchedules([{ uid: s.uid, name, date: to, start: s.start, end: s.end, breakMin: Number(s.breakMin) || 0, remote: !!s.remote }]);
      await refreshSchedList();
      const label = isLeave(s) ? leaveLabel(s) : shiftLabel(s);
      const removed = isLeave(s) && S.dropAsk.clash?.length ? `（已刪除那天 ${S.dropAsk.clash.length} 個班）` : "";
      S.schedMsg = { text: `已${v === "move" ? "移動" : "複製"}：${schedName(s)} ${label}，${dayLabel(s.date)} → ${dayLabel(to)}${removed}`, kind: "ok" };
    } catch (err) { S.schedMsg = { text: `${v === "move" ? "移動" : "複製"}失敗：` + (err.message || err) + RULES_HINT, kind: "err" }; }
    S.dropAsk = null; S.busy = false; render(); return;
  }
  if (act === "atab") {
    S.adminTab = v; S.schedMsg = null; S.adminMsg = null; S.day = null; S.dropAsk = null;
    if (v === "schedule") { S.selected = null; await loadSchedule(); }
    else if (!S.admin || S.admin.month !== S.month) await loadAdmin();
    else render();
    return;
  }
  if (act === "smonth") {
    const [y, m] = S.month.split("-").map(Number);
    S.month = v === "0" ? fmtMonth(new Date()) : fmtMonth(new Date(y, m - 1 + Number(v), 1));
    S.schedMsg = null; await loadSchedule(); return;
  }
  if (act === "sday") { openDay(v); render(); return; }
  if (act === "sedit") { openDay(S.day.date, v); render(); return; }
  if (act === "scancel") { openDay(S.day.date); render(); return; }
  if (act === "smode") { openDay(S.day.date, null, v); render(); return; }
  if (act === "sclose") { S.day = null; render(); return; }
  if (act === "spick") {
    if (S.day.editId) S.day.pick = new Set([v]);
    else S.day.pick.has(v) ? S.day.pick.delete(v) : S.day.pick.add(v);
    render(); return;
  }
  if (act === "scolorreset") { await saveColor(v, null); return; }

  /* ----- 前台月班表 ----- */
  if (act === "cday") { S.staffCal.sel = v; render(); return; }
  if (act === "cmonth") {
    const C = S.staffCal;
    const [y, m] = C.month.split("-").map(Number);
    C.month = v === "0" ? fmtMonth(new Date()) : fmtMonth(new Date(y, m - 1 + Number(v), 1));
    // 切到本月就選今天，其他月份選 1 號
    C.sel = C.month === fmtMonth(new Date()) ? fmtDate(new Date()) : C.month + "-01";
    C.list = null; render();
    await loadStaffCal(); render(); return;
  }
  if (act === "sdefault") {
    const st = S.sched.settings;
    S.day.form = { start: st.start, end: st.end, breakMin: Number(st.breakMin) || 0, remote: !!S.day.form.remote }; render(); return;
  }
  if (act === "sdel") {
    const s = S.sched.list.find(x => x.id === v);
    if (!s) return;
    const what = isLeave(s) ? `的${leaveLabel(s)}` : ` ${shiftLabel(s)} 這個班`;
    if (!confirm(isLeave(s) ? `確定要取消 ${schedName(s)} ${dayLabel(s.date)}${what}嗎？` : `確定要刪除 ${schedName(s)} ${dayLabel(s.date)}${what}嗎？`)) return;
    S.busy = true; render();
    try {
      await S.store.deleteSchedule(v);
      await refreshSchedList();
      if (S.day.editId === v) openDay(S.day.date, null, S.day.mode);
      S.day.msg = { text: isLeave(s) ? `已取消 ${schedName(s)} 的${leaveLabel(s)}` : `已刪除 ${schedName(s)} 的班`, kind: "ok" };
    } catch (err) { S.day.msg = { text: "刪除失敗：" + (err.message || err) + RULES_HINT, kind: "err" }; }
    S.busy = false; render(); return;
  }

  if (act === "role") { S.role = v; setMsg(null); if (v === "admin") await refreshAdminLeft(); render(); }
  else if (act === "mode") { S.mode = v; setMsg(null); if (S.role === "admin") await refreshAdminLeft(); render(); }
  else if (act === "logout") { await S.store.signOut(); S.me = null; S.mine = []; S.admin = null; S.adminMsg = null; S.sched = null; S.day = null; S.schedMsg = null; S.crew = null; S.myUpcoming = []; S.colors = {}; S.dropAsk = null; S.mode = "signin"; setMsg(null); render(); }
  else if (act === "punch") {
    if (S.busy) return;
    S.busy = true; setMsg(null); render();
    try { await S.store.addPunch(v); await reloadStaff(); setMsg(`${TYPES[v]}打卡成功 ${fmtTime(new Date())}`, "ok"); }
    catch (err) { setMsg("打卡失敗：" + (err.message || err)); }
    S.busy = false; render();
  }
  else if (act === "pick") { S.selected = v; S.open.clear(); S.adminMsg = null; render(); window.scrollTo(0, 0); }
  else if (act === "back") { S.selected = null; S.adminMsg = null; render(); }
  else if (act === "toggle") { S.open.has(v) ? S.open.delete(v) : S.open.add(v); render(); }
  else if (act === "reload") { S.adminMsg = null; S.schedMsg = null; await (S.adminTab === "schedule" ? loadSchedule() : loadAdmin()); }
  else if (act === "csv") exportCSV();
  else if (act === "del") {
    e.stopPropagation();
    if (!confirm("確定要刪除這筆打卡嗎？")) return;
    if (S.me.role !== "admin") {
      try { await S.store.deletePunch(v); S.fixMsg = { text: "已刪除這筆補登", kind: "ok" }; }
      catch (err) { S.fixMsg = { text: "刪除失敗：" + (err.message || err), kind: "err" }; }
      await reloadStaff(); render(); return;
    }
    try { await S.store.deletePunch(v); S.adminMsg = { text: "已刪除", kind: "ok" }; }
    catch (err) { S.adminMsg = { text: "刪除失敗：" + (err.message || err), kind: "err" }; }
    await loadAdmin();
  }
});

});

// 排班視窗：改時間時即時更新工時試算（不重畫整個畫面，才不會打斷輸入）
app.addEventListener("input", e => {
  const form = e.target.form;
  // 拖動色盤時先即時預覽旁邊的名字，放開（change）才存檔
  if (e.target.dataset?.color) { const chip = e.target.nextElementSibling; if (chip) chip.style.setProperty("--pc", e.target.value); return; }
  if (e.target.dataset?.tp) {   // 時／分下拉：組成 HH:MM 放進隱藏欄位
    const wrap = e.target.closest(".tp");
    const [hs, ms] = wrap.querySelectorAll("select");
    const hidden = wrap.querySelector("input[type=hidden]");
    hidden.value = `${hs.value}:${ms.value}`;
    if (form?.id === "schedForm" && S.day) { S.day.form[hidden.name] = hidden.value; const c = document.getElementById("sCalc"); if (c) c.innerHTML = calcLine(S.day.form); }
    return;
  }
  if (form?.id !== "schedForm" || !S.day || !e.target.name) return;
  if (e.target.name === "leaveType") { S.day.leaveType = e.target.value; return; }
  if (e.target.type === "checkbox") { S.day.form[e.target.name] = e.target.checked; return; }
  S.day.form[e.target.name] = e.target.name === "breakMin" ? Math.max(0, Number(e.target.value) || 0) : e.target.value;
  const c = document.getElementById("sCalc");
  if (c) c.innerHTML = calcLine(S.day.form);
});

app.addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target);

  if (e.target.id === "schedForm" && S.day?.mode === "leave") {
    const D = S.day;
    const fail = t => { D.msg = { text: t, kind: "err" }; render(); };
    if (!D.pick.size) return fail("請選擇至少一位人員");
    const leaveType = String(f.get("leaveType") || LEAVE_TYPES[0]);
    D.leaveType = leaveType;
    const nameFor = uid => staffName(uid) || "";
    const dayList = S.sched.list.filter(s => s.date === D.date);
    const already = new Set(leavesOnly(dayList).map(s => s.uid));
    const uids = [...D.pick].filter(u => !already.has(u));
    if (!uids.length) return fail("選的人這天已經是休假了");
    // 這天已經有班的人：確認後一起刪掉那些班
    const clash = shiftsOnly(dayList).filter(s => uids.includes(s.uid));
    if (clash.length && !confirm(`${clash.map(s => `${schedName(s)}（${shiftLabel(s)}）`).join("、")} 這天已經有排班。\n設為休假會一併刪除這些班，確定嗎？`)) return;
    S.busy = true; D.msg = null; render();
    try {
      await S.store.addSchedules(uids.map(uid => ({ uid, name: nameFor(uid), date: D.date, kind: "leave", leaveType })), clash.map(s => s.id));
      await refreshSchedList();
      openDay(D.date, null, "leave");
      S.day.msg = { text: `已設為${leaveType}：${uids.map(nameFor).join("、")}${clash.length ? `（已刪除 ${clash.length} 個班）` : ""}`, kind: "ok" };
    } catch (err) { D.msg = { text: "儲存失敗：" + (err.message || err) + RULES_HINT, kind: "err" }; }
    S.busy = false; render();
    return;
  }

  if (e.target.id === "schedForm") {
    const D = S.day;
    const fm = { start: String(f.get("start") || ""), end: String(f.get("end") || ""), breakMin: Math.max(0, Number(f.get("breakMin")) || 0), remote: f.get("remote") === "on" };
    D.form = fm;
    const fail = t => { D.msg = { text: t, kind: "err" }; render(); };
    if (!D.pick.size) return fail("請選擇至少一位人員");
    const offHere = leavesOnly(S.sched.list.filter(s => s.date === D.date)).filter(s => D.pick.has(s.uid));
    if (offHere.length) return fail(`${offHere.map(schedName).join("、")} 這天休假，不能排班（要排班請先取消休假）`);
    if (!fm.start || !fm.end) return fail("請填上班和下班時間");
    if (fm.start === fm.end) return fail("上班和下班時間不能一樣");
    if (shiftHours(fm) <= 0) return fail("扣掉休息時間後工時是 0，請檢查時間");
    const nameFor = uid => staffName(uid) || "";
    S.busy = true; D.msg = null; render();
    try {
      if (D.editId) {
        const uid = [...D.pick][0];
        await S.store.updateSchedule(D.editId, { uid, name: nameFor(uid), date: D.date, ...fm });
      } else {
        await S.store.addSchedules([...D.pick].map(uid => ({ uid, name: nameFor(uid), date: D.date, ...fm })));
      }
      const who = [...D.pick].map(nameFor).join("、");
      const wasEdit = !!D.editId;
      await refreshSchedList();
      openDay(D.date);
      S.day.msg = { text: `${wasEdit ? "已更新" : "已加入"}：${who} ${shiftLabel(fm)}${fm.remote ? "（居家）" : ""}`, kind: "ok" };
    } catch (err) { D.msg = { text: "儲存失敗：" + (err.message || err) + RULES_HINT, kind: "err" }; }
    S.busy = false; render();
    return;
  }

  if (e.target.id === "schedSetForm") {
    if (!S.sched.settingsOk) { S.schedMsg = { text: "讀不到目前的設定，為了避免覆蓋，請按「重新整理」後再存", kind: "err" }; render(); window.scrollTo(0, 0); return; }
    const v = {
      ...S.sched.settings,   // 保留人員顏色等其他設定
      start: String(f.get("start") || SCHED_DEFAULTS.start),
      end: String(f.get("end") || SCHED_DEFAULTS.end),
      breakMin: Math.max(0, Number(f.get("breakMin")) || 0),
      cycleStart: String(f.get("cycleStart") || ""),
    };
    S.busy = true; render();
    try { await S.store.saveScheduleSettings(v); S.sched.settings = v; S.schedMsg = { text: "排班預設值已儲存", kind: "ok" }; }
    catch (err) { S.schedMsg = { text: "儲存失敗：" + (err.message || err) + RULES_HINT, kind: "err" }; }
    S.busy = false; render(); window.scrollTo(0, 0);
    return;
  }

  if (e.target.id === "authForm") {
    const username = String(f.get("username") || "").trim().toLowerCase();
    const password = String(f.get("password") || "");
    if (!/^[a-z0-9_.-]{3,20}$/.test(username)) { setMsg("帳號只能用英文、數字、底線、點或減號，3–20 字"); return render(); }
    if (S.mode === "signup") {
      const displayName = String(f.get("displayName") || "").trim();
      if (!displayName) { setMsg("請填姓名"); return render(); }
      if (password !== f.get("password2")) { setMsg("兩次輸入的密碼不一樣"); return render(); }
    }
    S.busy = true; setMsg(null); render();
    try {
      let me;
      if (S.mode === "signup") me = await S.store.signUp({ username, password, displayName: String(f.get("displayName")).trim(), role: S.role });
      else {
        me = await S.store.signIn({ username, password });
        if (me.role !== S.role) {
          await S.store.signOut();
          throw new Error(me.role === "admin" ? "這是管理帳號，請切換到「管理員」登入" : "這是員工帳號，請切換到「員工」登入");
        }
      }
      S.me = me; S.busy = false; await afterLogin();
    } catch (err) {
      S.busy = false; setMsg(err.message || String(err)); render();
    }
  }

  if (e.target.id === "fixForm") {
    const form = e.target;
    const type = String(f.get("type"));
    const at = new Date(`${f.get("date")}T${f.get("time")}`);
    const reason = String(f.get("reason") || "").trim().slice(0, 50);
    const oldest = new Date(); oldest.setDate(oldest.getDate() - FIX_DAYS + 1); oldest.setHours(0, 0, 0, 0);
    if (isNaN(at)) { S.fixMsg = { text: "請選擇日期和時間", kind: "err" }; return render(); }
    if (at > new Date()) { S.fixMsg = { text: "不能補打未來的時間", kind: "err" }; return render(); }
    if (at < oldest) { S.fixMsg = { text: `只能補 ${FIX_DAYS} 天內的卡，更早的請找管理員`, kind: "err" }; return render(); }
    if (!confirm(`確定要補打卡嗎？\n\n${TYPES[type]}　${fmtDate(at)} ${fmtTime(at)}`)) return;
    S.busy = true; S.fixMsg = null; render();
    try {
      await S.store.addPunch(type, S.me.uid, at, reason);
      S.myMonth = fmtMonth(at);
      await reloadStaff();
      S.fixMsg = { text: `已補登 ${TYPES[type]} ${fmtDate(at)} ${fmtTime(at)}`, kind: "ok" };
      document.getElementById("fixForm")?.reset();
    } catch (err) { S.fixMsg = { text: "補打卡失敗：" + (err.message || err), kind: "err" }; }
    S.busy = false; render();
  }

  if (e.target.id === "addForm") {
    const at = new Date(String(f.get("at")));
    if (isNaN(at)) return;
    S.busy = true;
    try { await S.store.addPunch(String(f.get("type")), S.selected, at); S.adminMsg = { text: `已補登 ${TYPES[f.get("type")]} ${fmtDate(at)} ${fmtTime(at)}`, kind: "ok" }; }
    catch (err) { S.adminMsg = { text: "補登失敗：" + (err.message || err), kind: "err" }; }
    S.busy = false;
    await loadAdmin();
  }
});

// 時鐘與進行中的工時每秒更新
setInterval(() => {
  const c = document.getElementById("clock");
  if (!c) return;
  const n = new Date();
  c.textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  const typing = ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName);
  if (n.getSeconds() === 0 && S.me?.role === "staff" && !S.busy && !typing) render();
}, 1000);

/* ---------- 啟動 ---------- */
(async () => {
  try {
    S.store = FIREBASE_CONFIG ? await makeFirebaseStore(FIREBASE_CONFIG) : makeDemoStore();
    if (S.store.mode === "demo") document.getElementById("banner").innerHTML = `<div class="banner">示範模式：資料只存在這台瀏覽器。填入 Firebase 設定後，所有人才會共用同一份資料。</div>`;
    S.me = await S.store.init();
    if (S.me) { S.role = S.me.role; await afterLogin(); } else render();
  } catch (e) {
    app.innerHTML = `<div class="wrap narrow"><div class="card"><h2>無法啟動</h2><p class="muted">${esc(e.message || e)}</p><p class="small muted">請檢查 FIREBASE_CONFIG 是否正確。</p></div></div>`;
  }
})();
</script>
</body>
</html>
