<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --cream:#FBF5EC;
    --paper:#FFFFFF;
    --ink:#3E2F27;
    --ink-soft:#7A6A5E;
    --clay:#C9714E;
    --clay-dark:#A85A3B;
    --sage:#7C9473;
    --sage-dark:#5E7458;
    --mustard:#D6A34C;
    --line:#E7DCCC;
    --shadow: 0 8px 24px rgba(62,47,39,0.08);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--cream); color:var(--ink); font-family:'Noto Sans TC', sans-serif; min-height:100vh; }
  .wrap{ max-width:720px; margin:0 auto; padding:28px 20px 80px; }
  header.top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; }
  header.top h1{ font-family:'Noto Serif TC', serif; font-weight:900; font-size:26px; margin:0; letter-spacing:0.5px; }
  header.top .stamp-mark{ display:inline-block; width:10px;height:10px; border-radius:50%; background:var(--clay); margin-right:8px; vertical-align:middle; }
  .tabs{ display:flex; gap:6px; background:var(--paper); padding:5px; border-radius:999px; box-shadow:var(--shadow); margin-bottom:24px; }
  .tabs button{ flex:1; border:none; background:transparent; padding:11px 14px; border-radius:999px; font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:14px; color:var(--ink-soft); cursor:pointer; transition:all .2s ease; }
  .tabs button.active{ background:var(--ink); color:var(--cream); }
  .card{ background:var(--paper); border-radius:20px; padding:24px; box-shadow:var(--shadow); margin-bottom:18px; border:1px solid var(--line); }
  .card h2{ font-family:'Noto Serif TC',serif; font-size:18px; margin:0 0 16px; font-weight:700; }
  label{ display:block; font-size:13px; color:var(--ink-soft); margin:12px 0 6px; font-weight:500; }
  input, select{ width:100%; padding:11px 13px; border-radius:12px; border:1.5px solid var(--line); font-family:'Noto Sans TC',sans-serif; font-size:15px; background:#FFFDFA; color:var(--ink); }
  input:focus, select:focus{ outline:none; border-color:var(--clay); }
  .btn{ display:inline-block; width:100%; padding:13px 16px; border-radius:12px; border:none; font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:15px; cursor:pointer; margin-top:16px; transition:transform .12s ease, box-shadow .12s ease; }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--ink); color:var(--cream); }
  .btn-secondary{ background:var(--cream); color:var(--ink); border:1.5px solid var(--line); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); text-decoration:underline; padding:8px; margin-top:8px; font-size:13px; }
  .switch-link{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:14px; }
  .switch-link a{ color:var(--clay-dark); font-weight:700; cursor:pointer; text-decoration:underline; }
  .error-msg{ background:#FBEAE3; color:var(--clay-dark); padding:10px 14px; border-radius:10px; font-size:13px; margin-top:12px; display:none; }
  .error-msg.show{ display:block; }
  .stamp-zone{ text-align:center; padding:10px 0 6px; }
  .stamp-btn{ width:168px; height:168px; border-radius:50%; border:6px solid var(--ink); background:var(--cream); color:var(--ink); font-family:'Noto Serif TC',serif; font-weight:900; font-size:22px; cursor:pointer; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; transition:transform .15s ease, background .2s ease, color .2s ease; box-shadow: 0 0 0 4px var(--cream), 0 10px 26px rgba(62,47,39,0.15); }
  .stamp-btn.in-state{ border-color:var(--sage-dark); color:var(--sage-dark); }
  .stamp-btn.out-state{ border-color:var(--clay-dark); color:var(--clay-dark); }
  .stamp-btn:active{ transform:scale(0.94); }
  .stamp-btn .sub{ font-size:12px; font-weight:500; font-family:'Noto Sans TC',sans-serif; color:var(--ink-soft); }
  .stamp-flash{ animation: flash .5s ease; }
  @keyframes flash{ 0%{ box-shadow:0 0 0 4px var(--cream), 0 10px 26px rgba(62,47,39,0.15); } 40%{ box-shadow:0 0 0 10px rgba(201,113,78,0.25), 0 10px 26px rgba(62,47,39,0.15); } 100%{ box-shadow:0 0 0 4px var(--cream), 0 10px 26px rgba(62,47,39,0.15); } }
  .now-clock{ text-align:center; font-family:'Noto Serif TC',serif; font-size:14px; color:var(--ink-soft); margin-bottom:6px; }
  .greet{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .greet .name{ font-weight:700; }
  .logout-link{ font-size:12px; color:var(--ink-soft); cursor:pointer; text-decoration:underline; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td{ padding:9px 6px; text-align:left; border-bottom:1px solid var(--line); }
  th{ color:var(--ink-soft); font-weight:700; font-size:12px; }
  .tag{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .tag-in{ background:#EAF1E7; color:var(--sage-dark); }
  .tag-out{ background:#FBEAE3; color:var(--clay-dark); }
  .tag-backfill{ background:#FBF1DD; color:#9C7A2E; margin-left:4px; }
  .modal-bg{ position:fixed; inset:0; background:rgba(62,47,39,0.4); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-bg.show{ display:flex; }
  .modal{ background:var(--paper); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:24px; box-shadow:0 -10px 30px rgba(0,0,0,0.15); max-height:90vh; overflow-y:auto; }
  @media(min-width:540px){ .modal-bg{ align-items:center; } .modal{ border-radius:20px; } }
  .modal h3{ font-family:'Noto Serif TC',serif; margin:0 0 14px; font-size:18px; }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }
  .summary-row{ display:flex; justify-content:space-between; align-items:baseline; background:var(--cream); border-radius:14px; padding:16px; margin-bottom:16px; }
  .summary-row .big{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:28px; color:var(--clay-dark); }
  .summary-row .lbl{ font-size:12px; color:var(--ink-soft); }
  .empty-state{ text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 0; }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .setup-banner{ background:#FBEAE3; border:1.5px solid var(--clay); border-radius:16px; padding:20px; margin-bottom:20px; font-size:13.5px; line-height:1.7; }
  .setup-banner h2{ margin-top:0; font-family:'Noto Serif TC',serif; }
  .setup-banner code{ background:#fff; padding:1px 6px; border-radius:6px; font-size:12px; }
  .setup-banner a{ color:var(--clay-dark); font-weight:700; }
  .loading-dot{ text-align:center; padding:30px 0; color:var(--ink-soft); font-size:13px; }
  .admin-add{ margin-top:10px; }

  /* ---------- 排班 ---------- */
  .wrap{ transition:max-width .2s ease; }
  .wrap.wide{ max-width:1080px; }
  .subtabs{ display:flex; gap:6px; margin:-4px 0 18px; flex-wrap:wrap; }
  .subtabs button{ border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft); padding:8px 16px; border-radius:999px; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; }
  .subtabs button.active{ background:var(--clay); border-color:var(--clay); color:#fff; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .cal-head h2{ margin:0; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{ border:1.5px solid var(--line); background:var(--paper); color:var(--ink); border-radius:10px; padding:7px 12px; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px; }
  .cal-dow{ font-size:12px; color:var(--ink-soft); font-weight:700; text-align:center; padding:4px 0; }
  .cal-day{ min-height:96px; background:#FFFDFA; border:1.5px solid var(--line); border-radius:10px; padding:5px; cursor:pointer; display:flex; flex-direction:column; gap:3px; transition:border-color .15s; min-width:0; }
  .cal-day:hover{ border-color:var(--clay); }
  .cal-day.out{ opacity:.45; }
  .cal-day.today{ border-color:var(--ink); }
  .cal-num{ font-size:12px; font-weight:700; display:flex; justify-content:space-between; align-items:baseline; }
  .cal-num .hrs{ font-weight:500; color:var(--ink-soft); font-size:10.5px; }
  .chip{ font-size:11px; line-height:1.35; border-radius:6px; padding:2px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
  .chip .ct{ opacity:.8; }
  .chip.flag{ box-shadow: inset 0 0 0 1.5px var(--clay-dark); }
  .chip.flag::before{ content:'!'; font-weight:900; color:var(--clay-dark); margin-right:3px; }
  .more{ font-size:11px; color:var(--ink-soft); padding-left:2px; }
  @media(max-width:600px){ .cal-day{ min-height:72px; padding:4px 3px; } .chip .ct{ display:none; } .chip{ font-size:10.5px; padding:1px 4px; text-overflow:clip; } .chip.flag::before{ display:none; } .cal-num .hrs{ display:none; } }
  #schedSummary .tag{ white-space:nowrap; }
  .shift-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .shift-row .who{ flex:1; min-width:0; }
  .shift-row .who b{ display:block; }
  .shift-row .who span{ font-size:12px; color:var(--ink-soft); }
  .mini-btn{ border:1.5px solid var(--line); background:var(--paper); border-radius:8px; padding:5px 10px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; color:var(--ink); }
  .mini-btn.danger{ color:var(--clay-dark); }
  .dot{ width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none; }
  .people-pick{ display:flex; flex-wrap:wrap; gap:6px; }
  .people-pick button{ border:1.5px solid var(--line); background:#FFFDFA; border-radius:999px; padding:6px 12px; font-family:inherit; font-size:13px; cursor:pointer; color:var(--ink); }
  .people-pick button.on{ background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .warn-list{ margin:10px 0 0; padding-left:18px; font-size:12.5px; color:var(--clay-dark); line-height:1.7; }
  .calc-line{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; line-height:1.6; }
  .calc-line .w{ color:var(--clay-dark); font-weight:700; }
  .divider{ height:1px; background:var(--line); margin:18px 0 4px; }
  .modal h4{ font-family:'Noto Serif TC',serif; margin:10px 0 0; font-size:15px; }
  .crew-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .crew-row:last-child{ border-bottom:none; }
  .crew-row .who{ flex:1; min-width:0; }
  .crew-row .who span{ display:block; font-size:12px; color:var(--ink-soft); }
  .tag-wait{ background:#EDE9E3; color:var(--ink-soft); }
  .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .table-scroll{ overflow-x:auto; }
  tr.total td{ font-weight:700; border-bottom:none; }
  .ok-msg{ background:#EAF1E7; color:var(--sage-dark); padding:10px 14px; border-radius:10px; font-size:13px; margin-top:12px; display:none; }
  .ok-msg.show{ display:block; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span class="stamp-mark"></span>打卡系統</h1>
  </header>
  <div id="setupBannerZone"></div>
  <div class="tabs" id="mainTabs" style="display:none;">
    <button id="tabEmp" class="active">員工打卡</button>
    <button id="tabAdmin">後台管理</button>
  </div>
  <div id="viewEmployee"></div>
  <div id="viewAdmin" style="display:none;"></div>
</div>

<div class="modal-bg" id="backfillModalBg">
  <div class="modal">
    <h3>補打卡</h3>
    <label>類型</label>
    <select id="bfType">
      <option value="in">上班</option>
      <option value="out">下班</option>
    </select>
    <div class="row2">
      <div><label>日期</label><input type="date" id="bfDate"></div>
      <div><label>時間</label><input type="time" id="bfTime" step="1"></div>
    </div>
    <label>備註（選填）</label>
    <input type="text" id="bfNote" placeholder="例如：忘記打卡、手機沒電…">
    <div class="error-msg" id="bfError"></div>
    <button class="btn btn-primary" id="bfSubmit">送出補打卡</button>
    <button class="btn btn-ghost" id="bfCancel">取消</button>
  </div>
</div>

<div class="modal-bg" id="dayModalBg">
  <div class="modal">
    <h3 id="dayTitle"></h3>
    <div id="dayShifts"></div>
    <div class="divider"></div>
    <h4 id="dayFormTitle">新增排班</h4>
    <label id="dayPeopleLabel">人員（可複選）</label>
    <div class="people-pick" id="dayPeople"></div>
    <div class="row2">
      <div><label>上班時間</label><input type="time" id="dStart"></div>
      <div><label>下班時間</label><input type="time" id="dEnd"></div>
    </div>
    <label>休息時間（分鐘，不算工時）</label>
    <input type="number" id="dBreak" min="0" step="5">
    <button class="mini-btn" id="dDefault" style="margin-top:8px;">套用預設時間</button>
    <div class="calc-line" id="dCalc"></div>
    <div class="error-msg" id="dError"></div>
    <button class="btn btn-primary" id="dSave">加入班表</button>
    <button class="btn btn-ghost" id="dCancelEdit" style="display:none;">取消修改</button>
    <button class="btn btn-ghost" id="dClose">關閉</button>
  </div>
</div>

<script>
// =====================================================================
// FIREBASE 設定 — 請把下面六個值換成你自己 Firebase 專案的設定
// 步驟：
// 1. 到 https://console.firebase.google.com 建立一個新專案（免費）
// 2. 左側選單「建構」→「Firestore Database」→建立資料庫→選「測試模式」
// 3. 左側選單最上面點小齒輪「專案設定」，往下滑到「你的應用程式」
// 4. 選網頁（</>圖示），註冊應用程式，會拿到下面這組設定值，複製貼過來
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBRLxYvYCTEFt3CP2Kpat-cYY6OZxSKxtI",
  authDomain: "checkin-kindoof.firebaseapp.com",
  databaseURL: "https://checkin-kindoof-default-rtdb.firebaseio.com",
  projectId: "checkin-kindoof",
  storageBucket: "checkin-kindoof.firebasestorage.app",
  messagingSenderId: "93084869320",
  appId: "1:93084869320:web:cfb03e5581daf00acc3bfd",
  measurementId: "G-QPDRE14K6Q"
};

(async function(){
  const CONFIGURED = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('YOUR_');
  const setupZone = document.getElementById('setupBannerZone');
  const mainTabs = document.getElementById('mainTabs');
  const viewEmployee = document.getElementById('viewEmployee');
  const viewAdmin = document.getElementById('viewAdmin');

  if(!CONFIGURED){
    setupZone.innerHTML = `
      <div class="setup-banner">
        <h2>還差最後一步：連接雲端資料庫</h2>
        <p>這個系統需要一個免費的 Firebase 資料庫，讓所有人的打卡紀錄可以共用、不會消失。請照以下步驟操作：</p>
        <ol>
          <li>到 <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a> 建立一個新專案（免費）</li>
          <li>左側選單「建構」→「Firestore Database」→「建立資料庫」→選「測試模式」啟動</li>
          <li>左側選單上方齒輪圖示「專案設定」，往下滑到「你的應用程式」，點網頁圖示 <code>&lt;/&gt;</code> 註冊一個應用程式</li>
          <li>會出現一組設定值（apiKey、authDomain…等），把整段複製起來</li>
          <li>回來把這份 index.html 裡 <code>firebaseConfig</code> 的六個值換成你複製的內容，重新上傳到 GitHub 覆蓋原本的檔案</li>
        </ol>
        <p>把這幾個值告訴我，我也可以直接幫你填好、產生一份新的檔案給你上傳。</p>
      </div>`;
    return;
  }

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const dataRef = db.ref('attendance/data');
  const auth = firebase.auth();

  // Sign everyone in anonymously so database rules can require auth != null
  // instead of relying on Realtime Database's temporary "test mode" (which expires).
  await new Promise((resolve)=>{
    auth.onAuthStateChanged(user=>{
      if(user){ resolve(); }
      else { auth.signInAnonymously().catch(e=>{ console.error(e); resolve(); }); }
    });
  });

  async function getData(){
    try{
      const snap = await dataRef.once('value');
      if(snap.exists()) return snap.val();
      return {users:[], punches:{}, admins:[]};
    }catch(e){ console.error(e); return {users:[], punches:{}, admins:[]}; }
  }
  async function saveData(data){
    try{ await dataRef.set(data); return true; }catch(e){ console.error(e); return false; }
  }
  async function getUsers(){ const d = await getData(); return d.users || []; }
  async function saveUsers(list){ const d = await getData(); d.users = list; await saveData(d); }
  async function getPunches(username){ const d = await getData(); return (d.punches && d.punches[username]) || []; }
  async function savePunches(username, arr){ const d = await getData(); if(!d.punches) d.punches={}; d.punches[username] = arr; await saveData(d); }
  async function getAdmins(){ const d = await getData(); return d.admins || []; }
  async function saveAdmins(list){ const d = await getData(); d.admins = list; await saveData(d); }

  // ---------- 排班資料 ----------
  // 班表另外存在 attendance/schedule/{YYYY-MM-DD}/{班次id}，不跟打卡資料放在同一包。
  // （打卡會整包覆寫 attendance/data，如果班表也放在裡面，打卡和排班同時進行時可能互相蓋掉。）
  const schedRef = db.ref('attendance/schedule');
  const settingsRef = db.ref('attendance/scheduleSettings');
  const DEFAULT_SETTINGS = { start:'08:30', end:'22:30', breakMin:60, cycleStart:'' };
  async function getSettings(){
    try{ const s = await settingsRef.once('value'); return Object.assign({}, DEFAULT_SETTINGS, s.val() || {}); }
    catch(e){ console.error(e); return Object.assign({}, DEFAULT_SETTINGS); }
  }

  function pad2(n){ return String(n).padStart(2,'0'); }
  function dateKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function parseKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
  function addDays(d, n){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
  function toMin(t){ const [h,m] = String(t||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); }
  function isOvernight(s){ return toMin(s.end) <= toMin(s.start); }
  // 工時 = 下班 − 上班 − 休息；下班時間早於上班時間時視為跨夜班
  function shiftHours(s){ let span = toMin(s.end) - toMin(s.start); if(span <= 0) span += 1440; return Math.max(0, span - (Number(s.breakMin)||0)) / 60; }
  function fmtH(h){ return String(Math.round(h*100)/100); }
  function shiftLabel(s){ return s.start+'–'+s.end+(isOvernight(s)?'（跨夜）':''); }
  const WEEKDAYS = ['日','一','二','三','四','五','六'];
  const PALETTE = [
    {bg:'#EAF1E7', fg:'#4F6449'}, {bg:'#FBEAE3', fg:'#A85A3B'}, {bg:'#FBF1DD', fg:'#80621F'},
    {bg:'#E4EDF2', fg:'#3F6175'}, {bg:'#F1E6F0', fg:'#774A70'}, {bg:'#ECE8E2', fg:'#5E5247'}
  ];
  function colorFor(u){ let h = 0; for(const c of String(u)) h = (h*31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
  function nameOf(users, u){ const f = users.find(x=>x.username===u); return f ? f.name : u; }
  function sortedShifts(dayObj){ return Object.entries(dayObj||{}).map(([id,s])=>Object.assign({id}, s)).sort((a,b)=>toMin(a.start)-toMin(b.start)); }

  // 某月份實際打卡時數（只算完整的上下班配對，算法跟「出勤紀錄」一樣）
  function monthWorkedHours(punches, month){
    const list = (punches||[]).filter(p=>p.datetime.slice(0,7)===month).sort((a,b)=>a.datetime.localeCompare(b.datetime));
    let total = 0, openIn = null;
    list.forEach(p=>{
      if(p.type==='in'){ openIn = p; }
      else if(openIn){ const ms = new Date(p.datetime) - new Date(openIn.datetime); if(ms > 0) total += ms; openIn = null; }
    });
    return total / 3600000;
  }

  // 依班表算出工時提醒：單日 >10h、>12h、連續上班 7 天以上、雙週總時數 >80h
  function analyzeSchedule(data, settings){
    const perUser = {};   // username -> { 'YYYY-MM-DD': 當天工時 }
    Object.entries(data||{}).forEach(([date, day])=>{
      Object.values(day||{}).forEach(s=>{
        if(!s || !s.username) return;
        perUser[s.username] = perUser[s.username] || {};
        perUser[s.username][date] = (perUser[s.username][date]||0) + shiftHours(s);
      });
    });
    const dayFlags = {};  // 'username|date' -> [提醒文字]
    const add = (u,d,msg)=>{ const k = u+'|'+d; (dayFlags[k] = dayFlags[k] || []).push(msg); };
    Object.entries(perUser).forEach(([u, dates])=>{
      Object.entries(dates).forEach(([d,h])=>{
        if(h > 12) add(u, d, '當天工時 '+fmtH(h)+' 小時，超過含加班的 12 小時上限');
        else if(h > 10) add(u, d, '當天工時 '+fmtH(h)+' 小時，超過變形工時單日正常工時 10 小時（超過部分算加班）');
      });
      let run = 0, prev = null;
      Object.keys(dates).sort().forEach(k=>{
        run = (prev && dateKey(addDays(parseKey(prev),1))===k) ? run+1 : 1;
        if(run >= 7) add(u, k, '連續上班第 '+run+' 天（每 7 天至少要有 1 天例假）');
        prev = k;
      });
    });
    const cycleFlags = [];  // {user, from, to, hours}
    if(settings && settings.cycleStart){
      const base = parseKey(settings.cycleStart);
      Object.entries(perUser).forEach(([u, dates])=>{
        const sums = {};
        Object.entries(dates).forEach(([d,h])=>{
          const idx = Math.floor(Math.round((parseKey(d) - base) / 86400000) / 14);
          sums[idx] = (sums[idx]||0) + h;
        });
        Object.entries(sums).forEach(([idx,h])=>{
          if(h > 80){ const from = addDays(base, Number(idx)*14); cycleFlags.push({user:u, from:dateKey(from), to:dateKey(addDays(from,13)), hours:h}); }
        });
      });
    }
    return { dayFlags, cycleFlags };
  }

  function detachCrew(){ if(crewSub){ crewSub.ref.off('value', crewSub.fn); crewSub = null; } }
  function attachCrew(users, punchesAll){
    detachCrew();
    const k = todayStr();
    const ref = schedRef.child(k);
    const fn = snap=>renderCrew(sortedShifts(snap.val()), users, punchesAll, k);
    ref.on('value', fn, err=>{
      console.error(err);
      const el = document.getElementById('todayCrew');
      if(el) el.innerHTML = '<div class="empty-state">讀不到今天的班表</div>';
    });
    crewSub = {ref, fn};

  function renderCrew(shifts, users, punchesAll, k){
    const el = document.getElementById('todayCrew');
    if(!el) return;
    if(!shifts.length){ el.innerHTML = '<div class="empty-state">今天沒有排班</div>'; return; }
    el.innerHTML = shifts.map(s=>{
      const c = colorFor(s.username);
      const name = nameOf(users, s.username);
      const todays = (punchesAll[s.username]||[])
        .filter(p=>dateKey(new Date(p.datetime))===k)
        .sort((a,b)=>a.datetime.localeCompare(b.datetime));
      const last = todays[todays.length-1];
      const status = !last ? '<span class="tag tag-wait">尚未打卡</span>'
        : last.type==='in' ? '<span class="tag tag-in">上班中</span>'
        : '<span class="tag tag-out">已下班</span>';
      const me = currentUser && s.username===currentUser.username ? '（你）' : '';
      return `<div class="crew-row">
        <span class="dot" style="background:${c.bg};color:${c.fg}">${escapeHtml(name.slice(0,1))}</span>
        <div class="who"><b>${escapeHtml(name)}${me}</b><span>${shiftLabel(s)}</span></div>

  // 月曆一頁從週一排到週日，前後補滿整週
  function gridRange(first){
    const last = new Date(first.getFullYear(), first.getMonth()+1, 0);
    const gridStart = addDays(first, -((first.getDay()+6)%7));
    const gridEnd = addDays(last, 6 - ((last.getDay()+6)%7));
    return { first, last, gridStart, gridEnd };
  }

      <div class="card">
        <div class="cal-head">
          <h2 id="calTitle"></h2>
          <div class="cal-nav">
            <button id="calPrev">‹ 上個月</button>
            <button id="calThis">本月</button>
            <button id="calNext">下個月 ›</button>
          </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <p class="hint">點任一天就可以新增、修改或刪除那天的班。標著「!」的班有工時提醒，點進去可以看原因。</p>
      </div>
      <div class="card">
        <h2 id="sumTitle">本月時數</h2>
        <div id="schedSummary"></div>
      </div>
      <div class="card">
        <h2>排班預設值</h2>
        <div class="row2">
          <div><label>預設上班時間</label><input type="time" id="setStart" value="${settings.start}"></div>
          <div><label>預設下班時間</label><input type="time" id="setEnd" value="${settings.end}"></div>
        </div>
        <label>預設休息時間（分鐘）</label>
        <input type="number" id="setBreak" min="0" step="5" value="${Number(settings.breakMin)||0}">
        <label>雙週變形工時週期起始日（選填）</label>
        <input type="date" id="setCycle" value="${settings.cycleStart||''}">
        <p class="hint">填勞資會議紀錄上寫的實施日。填了之後，每兩週為一個週期，系統會提醒排班總時數超過 80 小時的人。</p>
        <div class="ok-msg" id="setOk">已儲存</div>
        <button class="btn btn-secondary" id="setSave">儲存預設值</button>
      </div>
    `;
    document.getElementById('calPrev').onclick = ()=>{ schedMonth = new Date(schedMonth.getFullYear(), schedMonth.getMonth()-1, 1); attachSchedMonth(); };
    document.getElementById('calNext').onclick = ()=>{ schedMonth = new Date(schedMonth.getFullYear(), schedMonth.getMonth()+1, 1); attachSchedMonth(); };
    document.getElementById('calThis').onclick = ()=>{ const n = new Date(); schedMonth = new Date(n.getFullYear(), n.getMonth(), 1); attachSchedMonth(); };
    document.getElementById('setSave').onclick = async ()=>{
      const s = {
        start: document.getElementById('setStart').value || DEFAULT_SETTINGS.start,
        end: document.getElementById('setEnd').value || DEFAULT_SETTINGS.end,
        breakMin: Math.max(0, Number(document.getElementById('setBreak').value)||0),
        cycleStart: document.getElementById('setCycle').value || ''
      };
      const ok = document.getElementById('setOk');
      try{
        await settingsRef.set(s);
        schedState.settings = s;
        ok.textContent = '已儲存'; ok.className = 'ok-msg show';
        drawCalendar(); drawSummary();
      }catch(e){
        console.error(e);
        ok.textContent = '儲存失敗：'+e.message; ok.className = 'error-msg show';
      }
      setTimeout(()=>{ ok.classList.remove('show'); }, 2500);
    };
    attachSchedMonth();
  }

  function attachSchedMonth(){
    detachSched();
    schedState.data = {};
    drawCalendar(); drawSummary();
    const { gridStart, gridEnd } = gridRange(schedMonth);
    // 多讀前後 13 天，才能檢查跨月的連續上班天數和雙週總時數
    const ref = schedRef.orderByKey().startAt(dateKey(addDays(gridStart,-13))).endAt(dateKey(addDays(gridEnd,13)));
    const fn = snap=>{ schedState.data = snap.val() || {}; drawCalendar(); drawSummary(); refreshDayModal(); };
    ref.on('value', fn, err=>{
      console.error(err);
      const grid = document.getElementById('calGrid');
      if(grid) grid.innerHTML = '<div class="error-msg show" style="grid-column:1/-1;">讀取班表失敗：'+escapeHtml(err.message)+'。請確認 Firebase 資料庫規則有開放 attendance/schedule 路徑。</div>';
    });
    schedSub = { ref, fn };
  }

  function drawCalendar(){
    const grid = document.getElementById('calGrid');
    if(!grid) return;
    const { first, gridStart, gridEnd } = gridRange(schedMonth);
    document.getElementById('calTitle').textContent = first.getFullYear()+' 年 '+(first.getMonth()+1)+' 月班表';
    const { dayFlags } = analyzeSchedule(schedState.data, schedState.settings);
    const today = todayStr();
    let html = ['一','二','三','四','五','六','日'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
    for(let d = new Date(gridStart); d <= gridEnd; d = addDays(d,1)){
      const k = dateKey(d);
      const shifts = sortedShifts(schedState.data[k]);
      const inMonth = d.getMonth() === first.getMonth();
      const chips = shifts.slice(0,4).map(s=>{
        const c = colorFor(s.username);
        const name = nameOf(schedState.users, s.username);
        const fl = dayFlags[s.username+'|'+k];
        const tip = name+' '+shiftLabel(s)+'，工時 '+fmtH(shiftHours(s))+' 小時'+(fl ? '\n'+fl.join('\n') : '');
        return `<div class="chip${fl?' flag':''}" style="background:${c.bg};color:${c.fg}" title="${escapeHtml(tip)}">${escapeHtml(name)} <span class="ct">${s.start}–${s.end}</span></div>`;
      }).join('');
      const more = shifts.length > 4 ? `<div class="more">還有 ${shifts.length-4} 人</div>` : '';
      html += `<div class="cal-day${inMonth?'':' out'}${k===today?' today':''}" data-k="${k}">
        <div class="cal-num"><span>${d.getDate()}</span>${shifts.length?`<span class="hrs">${shifts.length} 人</span>`:''}</div>
        ${chips}${more}
      </div>`;
    }
    grid.innerHTML = html;
    grid.querySelectorAll('.cal-day').forEach(el=>{ el.onclick = ()=>openDayModal(el.dataset.k); });
  }

  function drawSummary(){
    const el = document.getElementById('schedSummary');
    if(!el) return;
    const { first, last } = gridRange(schedMonth);
    const mk = dateKey(first).slice(0,7);
    document.getElementById('sumTitle').textContent = (first.getMonth()+1)+' 月時數統計';
    const { dayFlags, cycleFlags } = analyzeSchedule(schedState.data, schedState.settings);

    const stats = {};
    const ensure = u=>{ stats[u] = stats[u] || { days:new Set(), hours:0 }; return stats[u]; };
    schedState.users.forEach(u=>ensure(u.username));
    Object.entries(schedState.data).forEach(([d, day])=>{
      if(d.slice(0,7) !== mk) return;
      Object.values(day||{}).forEach(s=>{ if(!s || !s.username) return; const st = ensure(s.username); st.days.add(d); st.hours += shiftHours(s); });
    });
    const usernames = Object.keys(stats);
    if(!usernames.length){ el.innerHTML = '<div class="empty-state">目前還沒有員工建立打卡帳號</div>'; return; }

    const warnings = [];
    Object.entries(dayFlags).sort().forEach(([key, msgs])=>{
      const [u, d] = key.split('|');
      if(d.slice(0,7) !== mk) return;
      const dt = parseKey(d);
      msgs.forEach(m=>warnings.push({u, text:`${escapeHtml(nameOf(schedState.users,u))} ${dt.getMonth()+1}/${dt.getDate()}（${WEEKDAYS[dt.getDay()]}）：${m}`}));
    });
    const monthStartKey = dateKey(first), monthEndKey = dateKey(last);
    cycleFlags.filter(c=>c.to >= monthStartKey && c.from <= monthEndKey).forEach(c=>{
      warnings.push({u:c.user, text:`${escapeHtml(nameOf(schedState.users,c.user))} 週期 ${c.from.slice(5).replace('-','/')}～${c.to.slice(5).replace('-','/')}：排班共 ${fmtH(c.hours)} 小時，超過雙週 80 小時上限`});
    });
    const warnCount = {};
    warnings.forEach(w=>{ warnCount[w.u] = (warnCount[w.u]||0) + 1; });

    let tDays = 0, tHours = 0, tActual = 0;
    const rows = usernames
      .map(u=>({ u, name:nameOf(schedState.users,u), days:stats[u].days.size, hours:stats[u].hours, actual:monthWorkedHours(schedState.punches[u], mk) }))
      .sort((a,b)=>b.hours - a.hours || a.name.localeCompare(b.name))
      .map(r=>{
        tDays += r.days; tHours += r.hours; tActual += r.actual;
        const c = colorFor(r.u);
        return `<tr>
          <td><span class="tag" style="background:${c.bg};color:${c.fg}">${escapeHtml(r.name)}</span></td>
          <td class="num">${r.days}</td>
          <td class="num">${fmtH(r.hours)}</td>
          <td class="num">${fmtH(r.actual)}</td>
          <td class="num">${warnCount[r.u] ? `<span class="tag tag-out">${warnCount[r.u]} 項</span>` : '—'}</td>
        </tr>`;
      }).join('');

    el.innerHTML = `
      <div class="table-scroll"><table>
        <tr><th>人員</th><th class="num">排班天數</th><th class="num">排班時數</th><th class="num">實際打卡時數</th><th class="num">提醒</th></tr>
        ${rows}
        <tr class="total"><td>合計</td><td class="num">${tDays}</td><td class="num">${fmtH(tHours)}</td><td class="num">${fmtH(tActual)}</td><td></td></tr>
      </table></div>
      ${warnings.length ? `<ul class="warn-list">${warnings.map(w=>`<li>${w.text}</li>`).join('')}</ul>` : ''}
      <p class="hint">排班時數已扣掉休息時間；實際打卡時數只算完整的上下班配對（含休息時間）。${schedState.settings.cycleStart ? '' : '在下方設定雙週變形工時的週期起始日後，也會檢查每兩週 80 小時上限。'}</p>
    `;
  }

  // ---------- 單日排班視窗 ----------
  const dayModalBg = document.getElementById('dayModalBg');
  const dStart = document.getElementById('dStart');
  const dEnd = document.getElementById('dEnd');
  const dBreak = document.getElementById('dBreak');
  const dErr = document.getElementById('dError');
  const dSave = document.getElementById('dSave');
  const dCancelEdit = document.getElementById('dCancelEdit');
  let dayState = { key:null, editId:null, picked:new Set() };

  function openDayModal(k){
    dayState = { key:k, editId:null, picked:new Set() };
    resetDayForm();
    drawDayModal();
    dayModalBg.classList.add('show');
  }
  function closeDayModal(){ dayModalBg.classList.remove('show'); dayState.key = null; }
  function refreshDayModal(){ if(dayState.key && dayModalBg.classList.contains('show')) drawDayModal(); }

  function applyDefaultTimes(){
    const s = schedState.settings;
    dStart.value = s.start; dEnd.value = s.end; dBreak.value = Number(s.breakMin)||0;
  }
  function resetDayForm(){
    dayState.editId = null;
    dayState.picked = new Set();
    applyDefaultTimes();
    document.getElementById('dayFormTitle').textContent = '新增排班';
    document.getElementById('dayPeopleLabel').textContent = '人員（可複選）';
    dSave.textContent = '加入班表'; dSave.disabled = false;
    dCancelEdit.style.display = 'none';
    dErr.classList.remove('show');
    drawPeople(); updateCalc();
  }

  function drawDayModal(){
    const k = dayState.key;
    const dt = parseKey(k);
    document.getElementById('dayTitle').textContent = `${dt.getMonth()+1} 月 ${dt.getDate()} 日（週${WEEKDAYS[dt.getDay()]}）排班`;
    const shifts = sortedShifts(schedState.data[k]);
    const { dayFlags } = analyzeSchedule(schedState.data, schedState.settings);
    const box = document.getElementById('dayShifts');
    if(!shifts.length){
      box.innerHTML = '<div class="empty-state">這天還沒有排班</div>';
    } else {
      box.innerHTML = shifts.map(s=>{
        const c = colorFor(s.username);
        const name = nameOf(schedState.users, s.username);
        const fl = dayFlags[s.username+'|'+k];
        return `<div class="shift-row">
          <span class="dot" style="background:${c.bg};color:${c.fg}">${escapeHtml(name.slice(0,1))}</span>
          <div class="who">
            <b>${escapeHtml(name)}</b>
            <span>${shiftLabel(s)}・休息 ${Number(s.breakMin)||0} 分・工時 ${fmtH(shiftHours(s))} 小時</span>
            ${fl ? `<span style="color:var(--clay-dark);display:block;">${fl.map(escapeHtml).join('<br>')}</span>` : ''}
          </div>
          <button class="mini-btn" data-edit="${escapeHtml(s.id)}">修改</button>
          <button class="mini-btn danger" data-del="${escapeHtml(s.id)}">刪除</button>
        </div>`;
      }).join('');
      box.querySelectorAll('[data-edit]').forEach(b=>{ b.onclick = ()=>startEdit(b.dataset.edit); });
      box.querySelectorAll('[data-del]').forEach(b=>{ b.onclick = ()=>deleteShift(b.dataset.del); });
    }
    // 正在修改的班如果被別人刪掉了，就回到新增模式
    if(dayState.editId && !(schedState.data[k] && schedState.data[k][dayState.editId])) resetDayForm();
    else drawPeople();
  }

  function drawPeople(){
    const box = document.getElementById('dayPeople');
    const users = schedState.users;
    if(!users.length){ box.innerHTML = '<div class="hint">還沒有人在前台建立打卡帳號，建立後就能排班。</div>'; return; }
    box.innerHTML = users.map(u=>`<button type="button" data-u="${escapeHtml(u.username)}" class="${dayState.picked.has(u.username)?'on':''}">${escapeHtml(u.name)}</button>`).join('');
    box.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{
        const u = b.dataset.u;
        if(dayState.editId){ dayState.picked = new Set([u]); }
        else if(dayState.picked.has(u)){ dayState.picked.delete(u); }
        else { dayState.picked.add(u); }
        drawPeople();
      };
    });
  }

  function formShift(){ return { start:dStart.value, end:dEnd.value, breakMin:Math.max(0, Number(dBreak.value)||0) }; }
  function updateCalc(){
    const el = document.getElementById('dCalc');
    const s = formShift();
    if(!s.start || !s.end){ el.textContent = ''; return; }
    if(s.start === s.end){ el.innerHTML = '<span class="w">上班和下班時間不能一樣</span>'; return; }
    const h = shiftHours(s);
    let html = `工時 <b>${fmtH(h)}</b> 小時（已扣休息 ${s.breakMin} 分鐘）`;
    if(isOvernight(s)) html += '・跨夜班，下班時間算到隔天';
    if(h > 12) html += '<br><span class="w">超過含加班的 12 小時上限</span>';
    else if(h > 10) html += '<br><span class="w">超過變形工時單日正常工時 10 小時，超過部分要算加班</span>';
    el.innerHTML = html;
  }
  [dStart, dEnd, dBreak].forEach(i=>i.addEventListener('input', updateCalc));
  document.getElementById('dDefault').onclick = ()=>{ applyDefaultTimes(); updateCalc(); };
  document.getElementById('dClose').onclick = closeDayModal;
  dayModalBg.addEventListener('click', e=>{ if(e.target === dayModalBg) closeDayModal(); });
  dCancelEdit.onclick = resetDayForm;

  function startEdit(id){
    const s = schedState.data[dayState.key] && schedState.data[dayState.key][id];
    if(!s) return;
    dayState.editId = id;
    dayState.picked = new Set([s.username]);
    dStart.value = s.start; dEnd.value = s.end; dBreak.value = Number(s.breakMin)||0;
    document.getElementById('dayFormTitle').textContent = '修改排班';
    document.getElementById('dayPeopleLabel').textContent = '人員';
    dSave.textContent = '儲存修改';
    dCancelEdit.style.display = 'block';
    dErr.classList.remove('show');
    drawPeople(); updateCalc();
  }

  async function deleteShift(id){
    const s = schedState.data[dayState.key] && schedState.data[dayState.key][id];
    if(!s) return;
    if(!confirm(`確定要刪除 ${nameOf(schedState.users, s.username)} ${shiftLabel(s)} 這個班嗎？`)) return;
    try{ await schedRef.child(dayState.key).child(id).remove(); }
    catch(e){ console.error(e); alert('刪除失敗：'+e.message); }
  }

  dSave.onclick = async ()=>{
    dErr.classList.remove('show');
    const s = formShift();
    const fail = msg=>{ dErr.textContent = msg; dErr.classList.add('show'); };
    if(!dayState.picked.size) return fail('請選擇至少一位人員');
    if(!s.start || !s.end) return fail('請填上班和下班時間');
    if(s.start === s.end) return fail('上班和下班時間不能一樣');
    if(shiftHours(s) <= 0) return fail('扣掉休息時間後工時是 0，請檢查時間');
    const payload = Object.assign({}, s, { updatedBy: currentAdmin ? currentAdmin.username : '', updatedAt: new Date().toISOString() });
    const dayRef = schedRef.child(dayState.key);
    dSave.disabled = true; dSave.textContent = '儲存中…';
    try{
      if(dayState.editId){
        await dayRef.child(dayState.editId).update(Object.assign({}, payload, { username: [...dayState.picked][0] }));
      } else {
        const updates = {};
        dayState.picked.forEach(u=>{ updates[dayRef.push().key] = Object.assign({}, payload, { username:u }); });
        await dayRef.update(updates);
      }
      resetDayForm();
    }catch(e){
      console.error(e);
      dSave.disabled = false; dSave.textContent = dayState.editId ? '儲存修改' : '加入班表';
      fail('儲存失敗：'+e.message+'（請確認 Firebase 資料庫規則有開放 attendance/schedule 路徑）');
    }
  };

  async function loadAdminResults(){
    const username = document.getElementById('empSelect').value;
    const month = document.getElementById('monthSelect').value;
    const resultsEl = document.getElementById('adminResults');
    resultsEl.innerHTML = '<div class="loading-dot">載入紀錄中…</div>';
    const punches = await getPunches(username);
    const filtered = punches.filter(p=>p.datetime.slice(0,7)===month).sort((a,b)=>a.datetime.localeCompare(b.datetime));

    let totalMs = 0;
    let openIn = null;
    const rows = [];
    filtered.forEach(p=>{
      if(p.type==='in'){
        if(openIn){ rows.push({...openIn, unpaired:true}); }
        openIn = p;
        rows.push(p);
      } else {
        if(openIn){
          const durMs = new Date(p.datetime) - new Date(openIn.datetime);
          if(durMs > 0){ totalMs += durMs; }
          rows[rows.length-1] = rows[rows.length-1]; // openIn row stays
          rows.push({...p, pairDurationMs: durMs});
          openIn = null;
        } else {
          rows.push({...p, unpaired:true});
        }
      }
    });

    const totalHours = (totalMs / (1000*60*60));
    if(!filtered.length){
      resultsEl.innerHTML = `<div class="card"><div class="empty-state">這個月份沒有打卡紀錄</div></div>`;
      return;
    }
    resultsEl.innerHTML = `
      <div class="card">
        <div class="summary-row">
          <div>
            <div class="lbl">本月總時數（僅計算完整的上下班配對）</div>
            <div class="big">${totalHours.toFixed(2)} 小時</div>
          </div>
        </div>
        <table>
          <tr><th>日期</th><th>時間</th><th>類型</th><th>備註</th></tr>
          ${rows.map(r=>{
            const d = new Date(r.datetime);
            const dateStr = d.toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'});
            const timeStr = fmtTime(d);
            const typeTag = `<span class="tag ${r.type==='in'?'tag-in':'tag-out'}">${r.type==='in'?'上班':'下班'}</span>${r.backfill?'<span class="tag tag-backfill">補打卡</span>':''}${r.unpaired?'<span class="tag tag-backfill" style="background:#F3E3E3;color:#A85A3B;">未配對</span>':''}`;
            const note = r.note ? escapeHtml(r.note) : (r.pairDurationMs!==undefined ? '本次工時 '+(r.pairDurationMs/3600000).toFixed(2)+' 小時' : '');
            return `<tr><td>${dateStr}</td><td>${timeStr}</td><td>${typeTag}</td><td>${note}</td></tr>`;
          }).join('')}
        </table>
      </div>
    `;
  }

  renderEmployeeLoggedOut();
})();
</script>
</body>
</html>
